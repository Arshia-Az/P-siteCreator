services:
  web:
    build: .
    container_name: django-app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      -  .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: django_redis
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight:3.6
    container_name: redis_insight2
    ports:
      - "5540:5540"
    depends_on:
      - redis