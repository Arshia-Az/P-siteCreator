  .modal-overlay,.md-overlay{background:rgba(8,10,15,.80);animation:pbFade .14s ease;}
  .modal,.md-modal{background:var(--chrome-bg-alt,var(--cms-card-bg,#1d2128));border:1px solid var(--chrome-border,var(--cms-border,#2d333d));border-radius:10px;box-shadow:0 24px 60px -14px rgba(0,0,0,.6);animation:pbPop .18s ease;}
  .modal-header,.md-head{position:sticky;top:0;z-index:3;padding:14px 20px;background:var(--chrome-bg,var(--cms-input-bg,#161a20));border-bottom:1px solid var(--chrome-border,var(--cms-border,#2d333d));border-radius:10px 10px 0 0;}
  .modal-header h3,.md-head strong{font-size:14.5px;font-weight:700;letter-spacing:0;}
  .modal-header .icon-btn,.md-x{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:7px;background:transparent;color:inherit;cursor:pointer;padding:0;}
  .modal-header .icon-btn:hover,.md-x:hover{background:rgba(128,128,128,.18);border-color:rgba(128,128,128,.25);}
  .md-actions{position:sticky;bottom:-16px;margin:16px -18px -16px;padding:12px 18px;background:var(--cms-input-bg,var(--chrome-bg,#161a20));border-top:1px solid var(--cms-border,var(--chrome-border,#2d333d));border-radius:0 0 10px 10px;}
  @keyframes pbFade{from{opacity:0}to{opacity:1}}
  @keyframes pbPop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .hb-mdrawer-head button svg,.hb-mdrawer-toggle svg{pointer-events:none;}
  .hb-auto-m.ed-mobile .hb-menu{display:none !important;}
  .hb-auto-m.ed-mobile .hb-auto-burger{display:flex;}
  .embed #draftBtn,.embed #publishBtn,.embed #statusPill{display:none;}
  .hb-bbar.ed{display:flex;position:absolute;bottom:0;left:0;right:0;}
  .device-frame.mobile .dummy-page{min-height:420px;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#3a4152;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  #app{display:flex;flex-direction:column;height:100vh;}

  /* ===== topbar ===== */
  .topbar{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;background:var(--chrome-bg-alt);border-bottom:1px solid var(--chrome-border);padding:0 14px;gap:10px;}
  .tb-group{display:flex;align-items:center;gap:8px;}
  .brand{font-weight:700;font-size:14.5px;white-space:nowrap;}
  .brand span{color:var(--accent);}
  .hdrname-input{background:var(--chrome-bg);border:1px solid var(--chrome-border);color:var(--text-light);border-radius:8px;padding:6px 10px;font-size:12.5px;width:140px;}
  .icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--chrome-border);background:var(--chrome-bg);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:14px;}
  .icon-btn:hover{color:var(--text-light);border-color:#414a5c;}
  .icon-btn:disabled{opacity:.35;cursor:not-allowed;}
  .icon-btn:disabled:hover{color:var(--text-muted);border-color:var(--chrome-border);}
  .seg{display:flex;background:var(--chrome-bg);border:1px solid var(--chrome-border);border-radius:9px;padding:3px;gap:2px;}
  .seg button{border:none;background:transparent;color:var(--text-muted);padding:6px 11px;border-radius:7px;font-size:12px;display:flex;align-items:center;gap:5px;}
  .seg button.active{background:var(--accent);color:#1b1305;font-weight:700;}
  .zoom-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);}
  .zoom-row input[type=range]{width:70px;}
  .status-pill{font-size:10.5px;padding:4px 10px;border-radius:20px;font-weight:700;}
  .status-pill.draft{background:#3a2c12;color:#f2c27b;}
  .status-pill.published{background:#123a26;color:#3fbf7c;}
  .btn{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--chrome-border);background:var(--chrome-bg);color:var(--text-light);}
  .btn:hover{filter:brightness(1.15);}
  .btn.primary{background:var(--accent);color:#1b1305;border-color:var(--accent);}
  .btn.sm{padding:5px 10px;font-size:11.5px;}

  /* ===== layout ===== */
  .workspace{flex:1;display:flex;overflow:hidden;}
  .panel-left{width:250px;flex:none;background:var(--chrome-bg-alt);border-left:1px solid var(--chrome-border);display:flex;flex-direction:column;overflow:hidden;}
  .panel-right{width:320px;flex:none;background:var(--chrome-bg-alt);border-right:1px solid var(--chrome-border);display:flex;flex-direction:column;overflow:hidden;order:-1;}
  .panel-head{padding:12px 14px;border-bottom:1px solid var(--chrome-border);display:flex;align-items:center;justify-content:space-between;flex:none;}
  .panel-head h3{margin:0;font-size:13px;}
  .panel-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px;min-width:0;}
  .panel-right,.panel-left{min-width:0;}
  .panel-body details,.panel-body .repeat-item{min-width:0;max-width:100%;}
  .panel-body input:not([type=checkbox]):not([type=color]):not([type=file]):not([type=range]),.panel-body select,.panel-body textarea{width:100%;min-width:0;max-width:100%;background:var(--chrome-bg);border:1px solid var(--chrome-border);color:var(--text-light);border-radius:7px;padding:7px 9px;font-size:12px;}
  .panel-body input[type=file]{max-width:100%;font-size:11px;}
  .panel-body summary{min-width:0;}
  .panel-body summary span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .panel-body .mini-note code{word-break:break-all;}
  .center-scroll{flex:1;overflow:auto;background:radial-gradient(circle at 1px 1px,#ffffff10 1px,transparent 0) 0 0/22px 22px, var(--canvas-bg);display:flex;justify-content:center;padding:34px 24px;}
  .canvas-outer{transform-origin:top center;}
  .device-frame{width:1280px;transition:width .2s ease;background:var(--page-bg);border-radius:6px;box-shadow:0 0 0 1px #0002,0 18px 40px -18px #00000055;overflow:hidden;position:relative;}
  .device-frame.dark-preview{background:#12151c;}
  .device-frame.tablet{width:768px;}
  .device-frame.mobile{width:390px;}
  .dummy-page{padding:40px 30px;color:#8a8fa0;font-size:13px;min-height:600px;}
  .device-frame.dark-preview .dummy-page{color:#6d7484;}

  /* ===== layers tree ===== */
  .layer-toolbar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--chrome-border);}
  .tree-node{margin-bottom:3px;}
  .tree-row{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;font-size:12px;border:1px solid transparent;cursor:pointer;}
  .tree-row:hover{background:var(--chrome-bg);}
  .tree-row.selected{background:#f2a63a1f;border-color:var(--accent);color:var(--accent);}
  .tree-row .tlabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tree-row .tico{width:15px;flex:none;opacity:.8;text-align:center;}
  .tree-row .tactions{display:flex;gap:3px;opacity:0;}
  .tree-row:hover .tactions{opacity:1;}
  .tree-row .tactions button{width:20px;height:20px;border:none;background:transparent;color:var(--text-muted);border-radius:5px;font-size:11px;}
  .tree-row .tactions button:hover{color:var(--text-light);background:var(--chrome-bg-alt2);}
  .tree-row .tactions button.danger:hover{color:var(--danger);}
  .tree-row .vis-dot{width:5px;height:5px;border-radius:50%;background:var(--danger);flex:none;}
  .tree-children{padding-right:14px;border-right:1px dashed var(--chrome-border);margin-right:9px;}
  .tree-row[draggable=true]{cursor:grab;}
  .tree-row.drag-over-top{box-shadow:inset 0 2px 0 var(--accent);}
  .tree-row.drag-over-bottom{box-shadow:inset 0 -2px 0 var(--accent);}
  .tree-add-btn{width:100%;font-size:11.5px;padding:6px;border:1px dashed var(--chrome-border);background:transparent;color:var(--text-muted);border-radius:7px;margin-top:4px;}
  .tree-add-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* ===== settings panel ===== */
  .tabs-row{display:flex;border-bottom:1px solid var(--chrome-border);flex:none;}
  .tabs-row button{flex:1;min-width:0;white-space:nowrap;cursor:pointer;background:transparent;border:none;color:var(--text-muted);font-size:11px;padding:10px 2px;border-bottom:2px solid transparent;}
  .tabs-row button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}
  .sel-title{font-size:13px;font-weight:700;padding:2px 2px 10px;display:flex;align-items:center;gap:8px;}
  .sel-title .badge{font-size:10px;background:var(--chrome-bg);border:1px solid var(--chrome-border);padding:2px 7px;border-radius:20px;color:var(--text-muted);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px;}
  .field input[type=text],.field input[type=url],.field input[type=number],.field select,.field textarea{
    width:100%;background:var(--chrome-bg);border:1px solid var(--chrome-border);color:var(--text-light);border-radius:7px;padding:7px 9px;font-size:12px;
  }
  .field textarea{resize:vertical;font-family:monospace;direction:ltr;text-align:left;}
  .field input[type=color]{width:36px;height:30px;padding:2px;border:1px solid var(--chrome-border);border-radius:6px;background:var(--chrome-bg);}
  .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .row2>*,.row3>*,.row4>*{min-width:0;}
  .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
  .btn-group{display:flex;border:1px solid var(--chrome-border);border-radius:7px;overflow:hidden;}
  .btn-group button{flex:1;background:var(--chrome-bg);border:none;color:var(--text-muted);padding:7px 0;font-size:12px;border-left:1px solid var(--chrome-border);}
  .btn-group button:last-child{border-left:none;}
  .btn-group button.active{background:var(--accent);color:#1b1305;font-weight:700;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:10px;}
  .section-title{font-size:11.5px;font-weight:700;color:var(--text-light);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--chrome-border);display:flex;align-items:center;justify-content:space-between;}
  .section-title:first-child{margin-top:0;padding-top:0;border-top:none;}
  .mini-note{font-size:10.5px;color:#6d7484;line-height:1.6;margin-top:-4px;margin-bottom:10px;}
  .color-field-row{display:flex;align-items:center;gap:8px;}
  .color-field-row select{flex:1;}
  .state-strip{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap;}
  .state-strip button{font-size:10.5px;padding:5px 10px;border-radius:16px;border:1px solid var(--chrome-border);background:var(--chrome-bg);color:var(--text-muted);}
  .state-strip button.active{background:var(--accent);color:#1b1305;border-color:var(--accent);font-weight:700;}
  .device-note{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-muted);background:var(--chrome-bg);border:1px solid var(--chrome-border);border-radius:7px;padding:6px 9px;margin-bottom:12px;}
  .device-note b{color:var(--accent);}
  .reset-inherit{font-size:10px;color:var(--text-muted);background:none;border:none;text-decoration:underline;padding:0;}
  .repeat-item{border:1px solid var(--chrome-border);border-radius:9px;padding:9px 10px;margin-bottom:8px;background:var(--chrome-bg);}
  .repeat-item-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .repeat-item-head .drag{cursor:grab;opacity:.5;}
  .repeat-item-head .grow{flex:1;font-size:11.5px;font-weight:600;}
  .repeat-item-head button{width:22px;height:22px;border:none;background:transparent;color:var(--text-muted);border-radius:5px;font-size:11px;}
  .repeat-item-head button:hover{color:var(--danger);}
  .add-repeat-btn{width:100%;font-size:11.5px;padding:8px;border:1px dashed var(--chrome-border);background:transparent;color:var(--text-muted);border-radius:7px;}
  .add-repeat-btn:hover{border-color:var(--accent);color:var(--accent);}
  .cond-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
  .cond-row select{flex:1;}
  .cond-row input{flex:1;}
  .cond-row button{flex:none;width:26px;height:26px;border:1px solid var(--chrome-border);background:var(--chrome-bg);color:var(--danger);border-radius:6px;}
  .empty-panel{padding:40px 14px;text-align:center;color:var(--text-muted);font-size:12.5px;line-height:1.8;}

  /* ===== canvas rendering (header preview) ===== */
  .hb-row{position:relative;display:flex;}
  .hb-row.selected-outline, .hb-col.selected-outline, .hb-el.selected-outline{outline:2px solid var(--accent) !important;outline-offset:-2px;}
  .hb-row:hover{outline:1px dashed #f2a63a80;outline-offset:-1px;}
  .hb-col{position:relative;}
  .hb-col:hover{outline:1px dashed #4f7cff80;outline-offset:-1px;}
  .hb-el{position:relative;}
  .hb-el:hover{outline:1px dashed #3fbf7c80;outline-offset:-1px;}
  .hb-empty-col{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#b7bbc4;border:1px dashed #d8dbe1;border-radius:6px;margin:4px;}
  .hb-menu ul{list-style:none;margin:0;padding:0;display:flex;}
  .hb-menu a{text-decoration:none;color:inherit;display:flex;align-items:center;gap:4px;}
  .hb-menu li{position:relative;}
  .hb-menu .badge{font-size:9px;padding:1px 5px;border-radius:10px;margin-right:4px;}
  .hb-social{display:flex;}
  .hb-social a{display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;}
  .hb-linklist a{text-decoration:none;color:inherit;}
  .hb-scrolled-tag{position:absolute;top:2px;left:6px;font-size:9px;background:#12151cdd;color:var(--accent);padding:2px 7px;border-radius:10px;z-index:5;}

  /* dropdown style variants */
  .hb-dropdown a{display:block;padding:8px 10px;font-size:12.5px;text-decoration:none;color:#1c1f26;border-radius:6px;}
  .hb-dropdown a:hover{background:#f4f5f7;}
  .dd-nested-list{list-style:none;margin:0;padding:0;}
  .dd-nested-item{position:relative;}
  .dd-nested-item > a{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .dd-arrow{font-size:9px;opacity:.5;}
  .dd-flyout{display:none;position:absolute;top:0;right:100%;margin-right:6px;min-width:180px;padding:6px;z-index:51;}
  .dd-nested-item:hover > .dd-flyout{display:block;}
  .dd-mega-columns{display:flex;gap:22px;}
  .dd-mega-col{flex:1;min-width:120px;}
  .dd-mega-col h6{margin:0 0 8px;font-size:11.5px;font-weight:700;color:#9aa0ab;padding:0 10px;}
  .dd-mega-col a{padding:7px 10px;}
  .dd-mega-banner-wrap{display:flex;gap:20px;}
  .dd-mega-banner-wrap .dd-mega-columns{flex:1;}
  .dd-banner{flex:none;width:160px;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;background:#f4f5f7;text-decoration:none;color:#1c1f26;}
  .dd-banner img{width:100%;height:100px;object-fit:cover;display:block;}

function flattenDropdownLinks(d){
  if(!d) return [];
  const style = d.style || "simple";
  if(style === "nested") return (d.items||[]).flatMap(it => [{label:it.label,link:it.link}].concat((it.children||[]).map(ch=>({label:"— "+ch.label, link:ch.link}))));
  if(style === "mega-columns" || style === "mega-banner") return (d.columns||[]).flatMap(col => (col.links||[]).map(l=>({label:l.label, link:l.link})));
  if(style === "mega-grid") return (d.cards||[]).map(c=>({label:c.label, link:c.link}));
  return (d.items||[]).map(l=>({label:l.label, link:l.link}));
}

function dropdownToTree(d){
  const s = (d && d.style) || "simple";
  if(!d) return [];
  if(s === "nested") return (d.items||[]).map(i=>({label:i.label,link:i.link,children:(i.children||[]).map(c=>({label:c.label,link:c.link}))}));
  if(s === "mega-columns" || s === "mega-banner") return (d.columns||[]).map(c=>({label:c.title,link:"#",children:(c.links||[]).map(l=>({label:l.label,link:l.link}))}));
  if(s === "mega-grid") return (d.cards||[]).map(c=>({label:c.label,link:c.link,icon:c.icon,desc:c.desc,children:[]}));
  return (d.items||[]).map(i=>({label:i.label,link:i.link,icon:i.icon,desc:i.desc,children:[]}));
}
function convertDropdown(old, style){
  const tree = dropdownToTree(old);
  const nd = makeDropdown(style);
  ["align","offset","animation","duration","bg","border","radius","shadow"].forEach(k=>{ if(old && old[k] != null) nd[k] = old[k]; });
  if(!tree.length) return nd;
  const mk = o => Object.assign({id:uid()}, o);
  const caps = DROPDOWN_CAPS[style];
  const flat = [];
  tree.forEach(n=>{ flat.push({label:n.label,link:n.link,icon:n.icon,desc:n.desc}); (n.children||[]).forEach(c=>flat.push({label:c.label,link:c.link})); });
  if(style === "nested") nd.items = tree.slice(0,caps.maxItems).map(n=>mk({label:n.label,link:n.link,children:(n.children||[]).slice(0,caps.maxChildren).map(c=>mk(c))}));
  else if(style === "mega-columns" || style === "mega-banner"){
    const withKids = tree.filter(n=>n.children && n.children.length), loose = tree.filter(n=>!(n.children && n.children.length));
    const cols = withKids.map(n=>mk({title:n.label,links:n.children.slice(0,caps.maxLinks).map(c=>mk(c))}));
    if(loose.length) cols.push(mk({title:withKids.length?"سایر":"",links:loose.slice(0,caps.maxLinks).map(n=>mk({label:n.label,link:n.link}))}));
    nd.columns = cols.slice(0,caps.maxColumns);
  }
  else if(style === "mega-grid") nd.cards = flat.slice(0,caps.maxCards).map(n=>mk({icon:n.icon||"star",label:n.label,desc:n.desc||"",link:n.link}));
  else nd.items = flat.slice(0,caps.maxItems).map(n=>mk({label:n.label,link:n.link,icon:n.icon||"",desc:n.desc||""}));
  return nd;
}

function findRow(rowId, rows){ return (rows||header.rows).find(r=>r.id===rowId); }
function findColInRow(row, colId){ return row.columns.find(c=>c.id===colId); }
function findElInCol(col, elId){ return col.elements.find(e=>e.id===elId); }
function locate(kind, id){
  const rows = header.mobileMode==="separate" && currentDevice==="mobile" ? header.mobileRows : header.rows;
  if(kind === "row") return { row: findRow(id, rows) };
  for(const row of rows){
    if(kind === "col"){ const col = findColInRow(row, id); if(col) return { row, col }; }
    if(kind === "el"){ for(const col of row.columns){ const el = findElInCol(col, id); if(el) return {row,col,el}; } }
  }
  return {};
}

/* ================= style resolution -> inline CSS ================= */
function boxToCss(boxRv, device, prop){
  const b = resolveRV(boxRv, device) || {t:0,r:0,b:0,l:0};
  return `${prop}:${b.t}px ${b.r}px ${b.b}px ${b.l}px;`;
}
function colorOrToken(field){
  if(field && field.token) return paletteColor(field.token);
  return (field && field.value) || field || "transparent";
}
function elementBaseCss(el, device){
  const s = el.style;
  let css = "";
  const w = resolveRV(s.layout.width, device); if(w) css += `width:${w}px;`;
  const ht = resolveRV(s.layout.height, device); if(ht) css += `height:${ht}px;`;
  css += `font-size:${resolveRV(s.typography.fontSize, device)}px;`;
  css += `font-weight:${s.typography.fontWeight};`;
  css += `color:${s.colors.text};`;
  css += `background:${s.background.color};`;
  if(s.border.width) css += `border:${s.border.width}px ${s.border.style} ${s.border.color};`;
  css += `border-radius:${resolveRV(s.border.radius, device)}px;`;
  css += `box-shadow:${shadowCss(s.shadow)};`;
  css += boxToCss(s.spacing.margin, device, "margin");
  css += boxToCss(s.spacing.padding, device, "padding");
  const gap = resolveRV(s.gap, device); if(gap != null) css += `gap:${gap}px;`;
  css += `display:${visibleAt(s.visibility, device) ? "flex" : "none"};align-items:center;`;
  const align = resolveRV(s.layout.align, device);
  if(align === "center") css += "justify-content:center;";
  else if(align === "end") css += "justify-content:flex-end;";
  else if(align === "space-between") css += "justify-content:space-between;width:100%;";
  return css;
}
function visibleAt(vis, device){ return vis ? vis[device] !== false : true; }

let hoverCssBuf = [];
function collectHoverCss(id, states){
  if(states.hover && Object.keys(states.hover).length){
    let r = "";
    if(states.hover.color) r += `color:${states.hover.color};`;
    if(states.hover.background) r += `background:${states.hover.background};`;
    if(states.hover.border) r += `border-color:${states.hover.border};`;
    if(r) hoverCssBuf.push(`#${id}:hover{${r}}`);
  }
  if(states.disabled && Object.keys(states.disabled).length){
    let r = "";
    if(states.disabled.color) r += `color:${states.disabled.color};`;
    if(states.disabled.background) r += `background:${states.disabled.background};`;
    if(r) hoverCssBuf.push(`#${id}.is-disabled{${r}opacity:.65;pointer-events:none;}`);
  }
  if(states.scrolled && Object.keys(states.scrolled).length){
    let r = "";
    if(states.scrolled.color) r += `color:${states.scrolled.color};`;
    if(states.scrolled.background) r += `background:${states.scrolled.background};`;
    if(r) hoverCssBuf.push(`.is-scrolled #${id}{${r}}`);
  }
}

/* ================= element content renderers ================= */
function renderElementContent(el, device){
  const c = el.content;
  switch(el.type){
    case "logo": {
      if(c.logoType === "image" && c.image) return `<img src="${escapeHtml(c.image)}" alt="" style="max-height:34px;width:auto;object-fit:contain;display:block;">`;
      const txt = c.textToken ? resolveDynamic(c.textToken, c.text) : c.text;
      return `<span style="font-weight:700;font-size:16px;white-space:nowrap;">${escapeHtml(txt||"برند من")}</span>`;
    }
    case "menu": return renderMenuHtml(el, device);
    case "button": {
      const txt = c.textToken ? resolveDynamic(c.textToken, c.text) : c.text;
      return `<span style="display:flex;align-items:center;gap:6px;font-weight:600;">${c.icon?`<span>${iconHtml(c.icon)}</span>`:""}${escapeHtml(txt||"دکمه")}</span>`;
    }
    case "search": return c.style === "full" ? `<div style="display:flex;align-items:center;gap:6px;background:#f2f3f6;border-radius:20px;padding:6px 12px;"><span>${svgIc("search")}</span><span style="font-size:12px;color:#9aa0ab;">${escapeHtml(c.placeholder||"جستجو...")}</span></div>` : `<span style="font-size:16px;">${svgIc("search",18)}</span>`;
    case "icon": return `<span style="font-size:16px;">${iconHtml(c.glyph||"star")}</span>`;
    case "text": {
      const txt = c.textToken ? resolveDynamic(c.textToken, c.text) : c.text;
      return `<span>${escapeHtml(txt||"متن نمونه")}</span>`;
    }
    case "user": return `<span style="display:flex;align-items:center;gap:6px;"><span style="font-size:16px;">${svgIc("user",18)}</span>${c.showName?`<span style="font-size:12.5px;">${escapeHtml(resolveDynamic(c.nameToken,"کاربر"))}</span>`:""}</span>`;
    case "cart": return `<span style="position:relative;display:inline-flex;"><span style="font-size:16px;">${svgIc("cart",18)}</span>${c.showCount?`<span style="position:absolute;top:-7px;left:-9px;background:#e0435a;color:#fff;font-size:9px;border-radius:10px;padding:1px 5px;">${escapeHtml(resolveDynamic(c.countToken,"0"))}</span>`:""}</span>`;
    case "social": return `<div class="hb-social" style="gap:8px;">${c.links.map(l=>`<a href="${escapeHtml(l.url||"#")}" style="width:28px;height:28px;border-radius:50%;border:1px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;">${socialGlyph(l.platform)}</a>`).join("")}</div>`;

function renderDropdownPanel(d){
  const style = d.style || "simple";
  if(style === "nested"){
    return `<ul class="dd-nested-list">${(d.items||[]).map(it => {
      const hasKids = it.children && it.children.length;
      return `<li class="dd-nested-item">
        <a href="${escapeHtml(it.link||"#")}">${escapeHtml(it.label)}${hasKids?'<span class="dd-arrow">◂</span>':''}</a>
        ${hasKids ? `<div class="hb-dropdown dd-flyout" style="background:${d.bg};border:1px solid ${d.border};border-radius:${d.radius}px;box-shadow:${shadowCss(d.shadow)};">${it.children.map(ch=>`<a href="${escapeHtml(ch.link||"#")}">${escapeHtml(ch.label)}</a>`).join("")}</div>` : ""}
      </li>`;
    }).join("")}</ul>`;
  }
  if(style === "mega-columns" || style === "mega-banner"){
    const cols = `<div class="dd-mega-columns">${(d.columns||[]).map(col => `
      <div class="dd-mega-col"><h6>${escapeHtml(col.title||"")}</h6>${(col.links||[]).map(l=>`<a href="${escapeHtml(l.link||"#")}">${escapeHtml(l.label)}</a>`).join("")}</div>`).join("")}</div>`;
    if(style === "mega-banner" && d.banner){
      const bimg = d.banner.image ? `<img src="${escapeHtml(d.banner.image)}" alt="">` : `<div class="dd-banner-placeholder">${svgIc("image",28)}</div>`;
      return `<div class="dd-mega-banner-wrap">${cols}<a class="dd-banner" href="${escapeHtml(d.banner.link||"#")}">${bimg}<span>${escapeHtml(d.banner.title||"")}</span></a></div>`;
    }
    return cols;
  }
  if(style === "mega-grid"){
    return `<div class="dd-mega-grid">${(d.cards||[]).map(card => `
      <a class="dd-mega-card" href="${escapeHtml(card.link||"#")}"><span class="dd-card-icon">${iconHtml(card.icon||"star")}</span><span class="dd-card-label">${escapeHtml(card.label)}</span>${card.desc?`<span class="dd-card-desc">${escapeHtml(card.desc)}</span>`:""}</a>`).join("")}</div>`;
  }
  return (d.items||[]).map(l=>`<a href="${escapeHtml(l.link||"#")}">${l.icon?`<span>${iconHtml(l.icon)}</span> `:""}${escapeHtml(l.label)}${l.desc?`<small class="dd-item-desc">${escapeHtml(l.desc)}</small>`:""}</a>`).join("");

function renderMenuHtml(el, device){

    const activeCss = it.active ? `font-weight:700;color:${el.style.colors.text};` : "";

function renderElementWrapper(el, device){

function renderColumnWrapper(col, row, device){
  const s = col.style;
  let css = `display:${visibleAt(col.visibility, device) ? "flex" : "none"};`;
  const colDir = col.layout.direction === "column";
  css += `flex-direction:${colDir?"column":"row"};flex-wrap:${resolveRV(col.layout.wrap,device)?"wrap":"nowrap"};`;
  const w = resolveRV(col.width, device);
  css += w ? `flex:0 0 ${w}%;max-width:${w}%;` : `flex:1;`;
  const align = resolveRV(col.layout.align, device);
  const valign = resolveRV(col.layout.valign, device);
  if(colDir){
    css += `justify-content:flex-start;align-items:${align==="center"?"center":align==="end"?"flex-end":"flex-start"};`;
  } else {
    css += align === "center" ? "justify-content:center;" : align === "end" ? "justify-content:flex-end;" : align === "space-between" ? "justify-content:space-between;" : "justify-content:flex-start;";
    css += valign === "start" ? "align-items:flex-start;" : valign === "end" ? "align-items:flex-end;" : "align-items:center;";
  }
  css += `gap:${resolveRV(col.layout.gap, device)}px;`;
  css += `background:${s.background.color};`;
  if(s.border.width) css += `border:${s.border.width}px ${s.border.style} ${s.border.color};`;
  css += `border-radius:${resolveRV(s.border.radius, device)}px;`;
  css += `box-shadow:${shadowCss(s.shadow)};`;
  css += boxToCss(s.spacing.margin, device, "margin");
  css += boxToCss(s.spacing.padding, device, "padding");
  const inner = col.elements.length ? col.elements.map(el => renderElementWrapper(el, device)).join("") : `<div class="hb-empty-col" data-kind="col-empty" data-id="${col.id}">+ عنصر</div>`;
  return `<div class="hb-col" id="${col.id}" data-kind="col" data-id="${col.id}" style="${css}">${inner}</div>`;
}

function renderRowWrapper(row, device){
  const s = row.style;
  let css = `display:${visibleAt(row.visibility, device) ? "flex" : "none"};`;
  css += `background:${s.background.color};`;
  if(s.border.width) css += `border:${s.border.width}px ${s.border.style} ${s.border.color};`;
  css += `border-radius:${resolveRV(s.border.radius, device)}px;`;
  css += `box-shadow:${shadowCss(s.shadow)};`;
  css += boxToCss(s.spacing.margin, device, "margin");
  css += `gap:${resolveRV(row.layout.gap, device)}px;`;
  const valign = resolveRV(row.layout.valign, device);
  css += valign === "start" ? "align-items:flex-start;" : valign === "end" ? "align-items:flex-end;" : "align-items:center;";
  const innerPad = boxToCss(s.spacing.padding, device, "padding");
  const contentCss = row.layout.contentWidth === "boxed" ? "max-width:1180px;margin:0 auto;width:100%;" : "width:100%;";
  const cols = row.columns.map(c => renderColumnWrapper(c, row, device)).join("");
  return `<div class="hb-row" id="${row.id}" data-kind="row" data-id="${row.id}" style="${css}">
    <div style="${contentCss}${innerPad}display:flex;gap:${resolveRV(row.layout.gap, device)}px;align-items:inherit;">${cols}</div>
  </div>`;
}

function wireCanvasInteractions(){
  const canvas = document.getElementById("hbCanvas");
  canvas.querySelectorAll('[data-kind]').forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      const kind = el.dataset.kind, id = el.dataset.id;
      if(kind === "col-empty"){ openElementPicker(el.closest('[data-kind="col"]') ? el.dataset.id : id); return; }
      selection = { kind, id };
      renderRightPanel(); applySelectionOutline(); renderLayersTree();
    });
  });
  canvas.querySelectorAll(".hb-menu li").forEach(li => {
    const dd = li.querySelector(":scope > .hb-dd-wrap");
    if(!dd) return;
    li.addEventListener("mouseenter", () => { dd.style.display = "block"; });
    li.addEventListener("mouseleave", () => { dd.style.display = "none"; });
  });
  canvas.querySelectorAll("a").forEach(a => a.addEventListener("click", e => e.preventDefault()));
  canvas.querySelectorAll("form").forEach(f => f.addEventListener("submit", e => e.preventDefault()));
  /* mobile hamburger drawer: fully functional in the editor preview */
  const drawer = canvas.querySelector("#hbMDrawer");
  const overlay = canvas.querySelector("#hbMDrawerOverlay");
  const closeBtn = canvas.querySelector("#hbMDrawerClose");
  function openDrawer(e){ e.stopPropagation(); if(drawer){ drawer.classList.add("open"); overlay.classList.add("open"); } }
  function closeDrawer(){ if(drawer){ drawer.classList.remove("open"); overlay.classList.remove("open"); } }
  canvas.querySelectorAll('[data-hb-type="hamburger"],[data-hb-open-menu]').forEach(el => el.addEventListener("click", openDrawer));
  if(overlay) overlay.addEventListener("click", closeDrawer);
  if(closeBtn) closeBtn.addEventListener("click", closeDrawer);
  canvas.querySelectorAll('[data-mtoggle]').forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const sub = btn.closest(".hb-mdrawer-item").querySelector(".hb-mdrawer-sub");
      if(sub) sub.classList.toggle("open");
    });
  });
}

/* ================= layers tree ================= */
let dragState = null;
function getContainerFor(kind, id){
  if(kind === "row") return { array: activeRows() };
  const rows = activeRows();
  if(kind === "col"){ for(const r of rows){ if(r.columns.find(c=>c.id===id)) return { array:r.columns, ownerId:r.id }; } }
  if(kind === "el"){ for(const r of rows){ for(const c of r.columns){ if(c.elements.find(e=>e.id===id)) return { array:c.elements, ownerId:c.id }; } } }
  return {};
}
function reorderItem(kind, sourceId, targetId, before){
  const srcCtx = getContainerFor(kind, sourceId);
  const tgtCtx = getContainerFor(kind, targetId);
  if(!srcCtx.array || !tgtCtx.array) return;
  pushHistory();
  const srcIdx = srcCtx.array.findIndex(x=>x.id===sourceId);
  const item = srcCtx.array.splice(srcIdx,1)[0];
  let tgtIdx = tgtCtx.array.findIndex(x=>x.id===targetId);
  if(tgtIdx === -1) tgtIdx = tgtCtx.array.length;
  tgtCtx.array.splice(before ? tgtIdx : tgtIdx+1, 0, item);
  fullRerender();
}

function elIconLabel(type){ const t = ELEMENT_TYPES.find(x=>x.type===type); return t ? {icon:GLYPH[type]||"", label:t.label} : {icon:"", label:type}; }

function rowNodeHtml(row, idx){
  const sel = selection.kind==="row" && selection.id===row.id;
  const hidden = !visibleAt(row.visibility, currentDevice);
  return `<div class="tree-node">
    <div class="tree-row ${sel?"selected":""}" draggable="true" data-kind="row" data-id="${row.id}">
      <span class="tico">${GLYPH.row}</span><span class="tlabel">ردیف ${idx+1}</span>
      ${hidden?'<span class="vis-dot" title="مخفی در این دستگاه"></span>':""}
      <div class="tactions">
        <button data-act="dup-row" data-id="${row.id}" title="کپی">⧉</button>
        <button data-act="del-row" data-id="${row.id}" class="danger" title="حذف"><i class='ic ic-trash'></i></button>
      </div>
    </div>
    <div class="tree-children">
      ${row.columns.map((col,ci)=>colNodeHtml(col,row,ci)).join("")}
      <button class="tree-add-btn" data-act="add-col" data-row="${row.id}">+ ستون</button>
    </div>
  </div>`;
}
function colNodeHtml(col, row, idx){
  const sel = selection.kind==="col" && selection.id===col.id;
  const hidden = !visibleAt(col.visibility, currentDevice);
  return `<div class="tree-node">
    <div class="tree-row ${sel?"selected":""}" draggable="true" data-kind="col" data-id="${col.id}">
      <span class="tico">${GLYPH.col}</span><span class="tlabel">ستون ${idx+1}</span>
      ${hidden?'<span class="vis-dot" title="مخفی در این دستگاه"></span>':""}
      <div class="tactions">
        <button data-act="dup-col" data-id="${col.id}" title="کپی">⧉</button>
        <button data-act="del-col" data-id="${col.id}" class="danger" title="حذف"><i class='ic ic-trash'></i></button>
      </div>
    </div>
    <div class="tree-children">
      ${col.elements.map(el=>elNodeHtml(el)).join("")}
      <button class="tree-add-btn" data-act="add-el" data-col="${col.id}">+ عنصر</button>
    </div>
  </div>`;
}
function elNodeHtml(el){
  const sel = selection.kind==="el" && selection.id===el.id;
  const hidden = !visibleAt(el.style.visibility, currentDevice);
  const meta = elIconLabel(el.type);
  return `<div class="tree-node">
    <div class="tree-row ${sel?"selected":""}" draggable="true" data-kind="el" data-id="${el.id}">
      <span class="tico">${meta.icon}</span><span class="tlabel">${meta.label}</span>
      ${hidden?'<span class="vis-dot" title="مخفی در این دستگاه"></span>':""}
      <div class="tactions">
        <button data-act="dup-el" data-id="${el.id}" title="کپی">⧉</button>

function renderLayersTree(){
  const rows = activeRows();
  const tree = document.getElementById("layersTree");
  tree.innerHTML = rows.length ? rows.map((r,i)=>rowNodeHtml(r,i)).join("") : `<div class="empty-panel">هنوز ردیفی نیست<br>از دکمه بالا شروع کن</div>`;

  tree.querySelectorAll(".tree-row").forEach(row => {
    row.addEventListener("click", e => {
      if(e.target.closest(".tactions")) return;
      selection = { kind: row.dataset.kind, id: row.dataset.id };
      renderRightPanel(); renderLayersTree(); applySelectionOutline();
    });
    row.addEventListener("dragstart", e => {
      dragState = { kind: row.dataset.kind, id: row.dataset.id };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", row.dataset.id);
    });
    row.addEventListener("dragend", () => { dragState = null; tree.querySelectorAll(".drag-over-top,.drag-over-bottom").forEach(x=>x.classList.remove("drag-over-top","drag-over-bottom")); });
    row.addEventListener("dragover", e => {
      if(!dragState || row.dataset.kind !== dragState.kind || row.dataset.id === dragState.id) return;
      e.preventDefault();
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      row.classList.toggle("drag-over-top", before);
      row.classList.toggle("drag-over-bottom", !before);
    });
    row.addEventListener("dragleave", () => row.classList.remove("drag-over-top","drag-over-bottom"));
    row.addEventListener("drop", e => {
      if(!dragState || row.dataset.kind !== dragState.kind || row.dataset.id === dragState.id) return;
      e.preventDefault();
      const before = row.classList.contains("drag-over-top");
      row.classList.remove("drag-over-top","drag-over-bottom");
      reorderItem(dragState.kind, dragState.id, row.dataset.id, before);
      dragState = null;
    });
  });

  tree.querySelectorAll("[data-act]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const act = btn.dataset.act;
      if(act === "add-col"){ pushHistory(); findRow(btn.dataset.row, activeRows()).columns.push(makeColumn([])); fullRerender(); }
      else if(act === "add-el"){ openElementPicker(btn.dataset.col); }
      else if(act === "del-row"){ pushHistory(); const rows = activeRows(); const i = rows.findIndex(r=>r.id===btn.dataset.id); rows.splice(i,1); if(selection.id===btn.dataset.id) selection={kind:"header",id:null}; fullRerender(); }
      else if(act === "del-col"){ pushHistory(); const rows = activeRows(); for(const r of rows){ const i = r.columns.findIndex(c=>c.id===btn.dataset.id); if(i>-1){ r.columns.splice(i,1); break; } } if(selection.id===btn.dataset.id) selection={kind:"header",id:null}; fullRerender(); }
      else if(act === "del-el"){ pushHistory(); const rows = activeRows(); for(const r of rows) for(const c of r.columns){ const i = c.elements.findIndex(x=>x.id===btn.dataset.id); if(i>-1){ c.elements.splice(i,1); } } if(selection.id===btn.dataset.id) selection={kind:"header",id:null}; fullRerender(); }
      else if(act === "dup-row"){ pushHistory(); const rows = activeRows(); const i = rows.findIndex(r=>r.id===btn.dataset.id); const copy = clone(rows[i]); regenIds(copy); rows.splice(i+1,0,copy); fullRerender(); }
      else if(act === "dup-col"){ pushHistory(); const rows = activeRows(); for(const r of rows){ const i = r.columns.findIndex(c=>c.id===btn.dataset.id); if(i>-1){ const copy = clone(r.columns[i]); regenIdsCol(copy); r.columns.splice(i+1,0,copy); break; } } fullRerender(); }
      else if(act === "dup-el"){ pushHistory(); const rows = activeRows(); for(const r of rows) for(const c of r.columns){ const i = c.elements.findIndex(x=>x.id===btn.dataset.id); if(i>-1){ const copy = clone(c.elements[i]); copy.id = uid(); c.elements.splice(i+1,0,copy); } } fullRerender(); }
    });
  });
}
function regenIdsCol(col){ col.id = uid(); col.elements.forEach(e=>e.id=uid()); }
function regenIds(row){ row.id = uid(); row.columns.forEach(regenIdsCol); }

/* ================= settings panel: field kit ================= */
let fieldRegistry = [];
const menuOpen = new Set();
let pendingSnapshot = null;
function ensureSnapshot(){ if(pendingSnapshot===null) pendingSnapshot = JSON.stringify(header); }
function commitSnapshot(){ if(pendingSnapshot!==null){ historyPast.push(pendingSnapshot); if(historyPast.length>60) historyPast.shift(); historyFuture=[]; updateHistoryButtons(); pendingSnapshot=null; } }
function wireFields(){ fieldRegistry.forEach(f=>f()); fieldRegistry=[]; }

function fText(label, value, onChange, area){
  const id = uid();
  fieldRegistry.push(()=>{ document.getElementById(id).addEventListener("change", e=>{ pushHistory(); onChange(e.target.value); fullRerender(); }); });
  return `<div class="field"><label>${label}</label>${area?`<textarea id="${id}" rows="4">${escapeHtml(value)}</textarea>`:`<input type="text" id="${id}" value="${escapeHtml(value)}">`}</div>`;
}
function fNumber(label, value, onChange, opts){
  opts = opts || {}; const id = uid();
  fieldRegistry.push(()=>{ document.getElementById(id).addEventListener("change", e=>{ pushHistory(); onChange(e.target.value===""?null:+e.target.value); fullRerender(); }); });
  return `<div class="field"><label>${label}</label><input type="number" id="${id}" value="${value==null?"":value}" ${opts.min!=null?`min="${opts.min}"`:""} ${opts.max!=null?`max="${opts.max}"`:""} ${opts.step?`step="${opts.step}"`:""}></div>`;
}
function fSelect(label, value, options, onChange){
  const id = uid();
  fieldRegistry.push(()=>{ document.getElementById(id).addEventListener("change", e=>{ pushHistory(); onChange(e.target.value); fullRerender(); }); });
  return `<div class="field"><label>${label}</label><select id="${id}">${options.map(o=>`<option value="${o.v}" ${o.v===value?"selected":""}>${o.t}</option>`).join("")}</select></div>`;
}
function fCheckbox(label, checked, onChange){
  const id = uid();
  fieldRegistry.push(()=>{ document.getElementById(id).addEventListener("change", e=>{ pushHistory(); onChange(e.target.checked); fullRerender(); }); });
  return `<label class="checkbox-row"><input type="checkbox" id="${id}" ${checked?"checked":""}> ${label}</label>`;
}
function fColor(label, value, onChange){
  const id = uid(); const safe = (value && /^#/.test(value)) ? value : "#000000";
  fieldRegistry.push(()=>{
    const inp = document.getElementById(id);
    inp.addEventListener("input", e=>{ ensureSnapshot(); onChange(e.target.value); renderCanvas(); });
    inp.addEventListener("change", e=>{ onChange(e.target.value); commitSnapshot(); fullRerender(); });
  });
  return `<div class="field"><label>${label}</label><input type="color" id="${id}" value="${safe}"></div>`;
}
function fAlign(label, rvObj, options){
  options = options || [{v:"start",t:"شروع"},{v:"center",t:"وسط"},{v:"end",t:"پایان"},{v:"space-between",t:"فاصله‌دار"}];
  const val = resolveRV(rvObj, currentDevice);
  const overridden = isOverridden(rvObj, currentDevice);
  const gid = "g"+uid();
  fieldRegistry.push(()=>{
    document.querySelectorAll(`[data-g="${gid}"]`).forEach(b=>{
      b.addEventListener("click", ()=>{ pushHistory(); rvObj[currentDevice] = b.dataset.v; fullRerender(); });
    });
    const rst = document.getElementById("rst"+gid);
    if(rst) rst.addEventListener("click", ()=>{ pushHistory(); rvObj[currentDevice] = null; fullRerender(); });
  });
  return `<div class="field"><label>${deviceLabel(label, currentDevice, overridden)} ${overridden?`<button class="reset-inherit" id="rst${gid}">بازنشانی</button>`:""}</label>
    <div class="btn-group">${options.map(o=>`<button type="button" data-g="${gid}" data-v="${o.v}" class="${val===o.v?"active":""}">${o.t}</button>`).join("")}</div></div>`;
}
function fResponsiveNumber(label, rvObj, opts){
  opts = opts || {};
  const val = resolveRV(rvObj, currentDevice);
  const overridden = isOverridden(rvObj, currentDevice);
  const id = uid();
  fieldRegistry.push(()=>{
    document.getElementById(id).addEventListener("change", e=>{ pushHistory(); rvObj[currentDevice] = e.target.value===""?null:+e.target.value; fullRerender(); });
    const rst = document.getElementById("rst"+id);
    if(rst) rst.addEventListener("click", ()=>{ pushHistory(); rvObj[currentDevice] = null; fullRerender(); });
  });
  return `<div class="field"><label>${deviceLabel(label, currentDevice, overridden)} ${overridden?`<button class="reset-inherit" id="rst${id}">بازنشانی</button>`:""}</label>
    <input type="number" id="${id}" value="${val==null?"":val}" ${opts.min!=null?`min="${opts.min}"`:""} ${opts.max!=null?`max="${opts.max}"`:""} placeholder="${opts.placeholder||""}"></div>`;
}
function deviceLabel(label, device, overridden){
  if(device === "desktop") return label;
  const dn = device === "tablet" ? "تبلت" : "موبایل";
  return `${label} <span style="color:var(--text-faint);">(${dn}${overridden?"":" - وراثتی"})</span>`;
}
function fSpacingBox(label, rvObj){
  const val = resolveRV(rvObj, currentDevice) || {t:0,r:0,b:0,l:0};
  const overridden = isOverridden(rvObj, currentDevice);
  const ids = { t:uid(), r:uid(), b:uid(), l:uid() };
  fieldRegistry.push(()=>{
    ["t","r","b","l"].forEach(k=>{
      document.getElementById(ids[k]).addEventListener("change", e=>{
        pushHistory();
        const cur = resolveRV(rvObj, currentDevice) || {t:0,r:0,b:0,l:0};
        const next = Object.assign({}, cur, { [k]: +e.target.value || 0 });
        rvObj[currentDevice] = next;
        fullRerender();
      });
    });
    const rst = document.getElementById("rstsp"+ids.t);
    if(rst) rst.addEventListener("click", ()=>{ pushHistory(); rvObj[currentDevice]=null; fullRerender(); });
  });
  return `<div class="field"><label>${deviceLabel(label, currentDevice, overridden)} ${overridden?`<button class="reset-inherit" id="rstsp${ids.t}">بازنشانی</button>`:""}</label>
    <div class="row4">
      <input type="number" id="${ids.t}" value="${val.t}" placeholder="بالا">
      <input type="number" id="${ids.r}" value="${val.r}" placeholder="راست">
      <input type="number" id="${ids.b}" value="${val.b}" placeholder="پایین">
      <input type="number" id="${ids.l}" value="${val.l}" placeholder="چپ">
    </div></div>`;
}
function fShadow(label, value, onChange){
  return fSelect(label, value, globalStyles.shadow.map(s=>({v:s.id,t:s.name})), onChange);
}
function fVisibility(vis){
  const ids = { d:uid(), t:uid(), m:uid() };
  fieldRegistry.push(()=>{
    document.getElementById(ids.d).addEventListener("change", e=>{ pushHistory(); vis.desktop = e.target.checked; fullRerender(); });
    document.getElementById(ids.t).addEventListener("change", e=>{ pushHistory(); vis.tablet = e.target.checked; fullRerender(); });
    document.getElementById(ids.m).addEventListener("change", e=>{ pushHistory(); vis.mobile = e.target.checked; fullRerender(); });
  });
  return `<div class="field"><label>نمایش بر اساس دستگاه</label>
    <label class="checkbox-row"><input type="checkbox" id="${ids.d}" ${vis.desktop?"checked":""}> دسکتاپ</label>
    <label class="checkbox-row"><input type="checkbox" id="${ids.t}" ${vis.tablet?"checked":""}> تبلت</label>
    <label class="checkbox-row"><input type="checkbox" id="${ids.m}" ${vis.mobile?"checked":""}> موبایل</label>
  </div>`;
}
function fColorWithToken(label, colorField, onColorChange){
  return fColor(label, colorField, onColorChange);
}

/* ================= settings panel: dispatcher ================= */
function renderRightPanel(){
  fieldRegistry = [];
  const tabsRow = document.getElementById("tabsRow");
  const body = document.getElementById("rightPanelBody");
  const titleEl = document.getElementById("rightPanelTitle");
  if(selection.kind === "header" || !selection.id){
    tabsRow.classList.add("hidden");
    titleEl.textContent = "تنظیمات هدر";
    body.innerHTML = renderHeaderPanel();
  } else {
    let ctx = locate(selection.kind, selection.id);
    if(!ctx || (!ctx.row && !ctx.col && !ctx.el)){ selection = {kind:"header", id:null}; renderRightPanel(); return; }
    tabsRow.classList.remove("hidden");
    tabsRow.querySelectorAll("button").forEach(b=>b.classList.toggle("active", b.dataset.tab===currentTab));
    if(selection.kind === "row"){ titleEl.textContent = "تنظیمات ردیف"; body.innerHTML = renderRowPanel(ctx.row, currentTab); }
    else if(selection.kind === "col"){ titleEl.textContent = "تنظیمات ستون"; body.innerHTML = renderColPanel(ctx.col, currentTab); }
    else { titleEl.textContent = "عنصر: " + elIconLabel(ctx.el.type).label; body.innerHTML = renderElPanel(ctx.el, currentTab); }
  }
  wireFields();
}

  const s = el.style;
  let html = `<div class="state-strip" id="stateStrip">
    ${[["normal","عادی"],["hover","هاور"],["disabled","غیرفعال"],["scrolled","اسکرول‌شده"]].map(([v,t])=>`<button data-st="${v}" class="${currentState===v?"active":""}">${t}</button>`).join("")}
  </div>`;
  fieldRegistry.push(()=>{
    document.querySelectorAll("#stateStrip [data-st]").forEach(b=>b.addEventListener("click", ()=>{ currentState = b.dataset.st; renderRightPanel(); }));
  });
  const isNormal = currentState === "normal";
  const stateObj = isNormal ? null : s.states[currentState];
  if(!isNormal) html += `<div class="mini-note">در حالت «${{hover:"هاور",disabled:"غیرفعال",scrolled:"اسکرول‌شده"}[currentState]}» فقط رنگ متن، پس‌زمینه و رنگ حاشیه قابل بازنویسی است.</div>`;

  html += `<div class="section-title">تایپوگرافی</div>`;
  if(isNormal){

  } else {
    html += `<div class="mini-note">تایپوگرافی فقط در حالت عادی قابل تنظیم است.</div>`;

  html += `<div class="section-title">رنگ‌ها</div>`;

    html += fColor("رنگ متن/آیکون", s.colors.text, v=>{ s.colors.text = v; s.colors.icon = v; });
  } else {
    html += fColor("رنگ متن در این حالت", stateObj.color || s.colors.text, v=>{ stateObj.color = v; });
  }

  html += `<div class="section-title">پس‌زمینه</div>`;
  if(isNormal){
    html += fColor("رنگ پس‌زمینه", s.background.color, v=>{ s.background.color = v; });
  } else {
    html += fColor("رنگ پس‌زمینه در این حالت", stateObj.background || s.background.color, v=>{ stateObj.background = v; });
  }

  html += `<div class="section-title">حاشیه، گردی و سایه</div>`;
  if(isNormal){
    html += fNumber("ضخامت border (px)", s.border.width, v=>{ s.border.width = v||0; }, {min:0});
    html += fSelect("نوع خط border", s.border.style, [{v:"solid",t:"ممتد"},{v:"dashed",t:"خط‌چین"},{v:"dotted",t:"نقطه‌چین"}], v=>{ s.border.style = v; });
    html += fColor("رنگ border", s.border.color, v=>{ s.border.color = v; });
    html += fResponsiveNumber("گردی گوشه‌ها (px)", s.border.radius, {min:0});
    html += fShadow("سایه", s.shadow, v=>{ s.shadow = v; });
  } else {
    html += fColor("رنگ border در این حالت", stateObj.border || s.border.color, v=>{ stateObj.border = v; });
  }

  if(isNormal){
    html += `<div class="section-title">فاصله‌گذاری</div>`;
    html += fSpacingBox("Padding داخلی", s.spacing.padding);
    html += fSpacingBox("Margin بیرونی", s.spacing.margin);
  }
  if(el.type === "button" && isNormal){
    html += `<div class="section-title">وضعیت</div>`;
    html += fCheckbox("غیرفعال نمایش داده شود (پیش‌نمایش)", !!el.content.isDisabled, v=>{ el.content.isDisabled = v; });
  }
  return html;
}

function tokenSelectHtml(id, current){

}
function fDynamicText(label, textVal, tokenVal, onText, onToken){
  const tid = uid();
  fieldRegistry.push(()=>{ document.getElementById(tid).addEventListener("change", e=>{ pushHistory(); onToken(e.target.value); fullRerender(); }); });
  let html = `<div class="field"><label>منبع محتوا</label>${tokenSelectHtml(tid, tokenVal)}</div>`;
  if(!tokenVal) html += fText(label, textVal, onText);
  else html += `<div class="mini-note">مقدار نمایشی: «${resolveDynamic(tokenVal, textVal)}» (در سایت واقعی جایگزین می‌شود)</div>`;

  if(el.type === "image"){

    fieldRegistry.push(()=>{ document.getElementById(fid).addEventListener("change", e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ pushHistory(); c.src=ev.target.result; fullRerender(); }; r.readAsDataURL(f); }); });

function renderRepeatEditor(arr, key, fields, make, addLabel){
  let html = arr.map((it,i)=>`<div class="repeat-item"><div class="repeat-item-head"><span class="grow">آیتم ${toFaNum(i+1)}</span><button type="button" data-rp-del="${key}:${it.id}"><i class='ic ic-trash'></i></button></div>${fields.map(([f,l])=>`<div class="field"><label>${l}</label><input type="text" data-rp="${key}:${it.id}:${f}" value="${escapeHtml(it[f]||"")}"></div>`).join("")}</div>`).join("");
  html += `<button type="button" class="add-repeat-btn" data-rp-add="${key}">${addLabel}</button>`;
  fieldRegistry.push(()=>{
    document.querySelectorAll(`[data-rp^="${key}:"]`).forEach(inp=>inp.addEventListener("change", e=>{ pushHistory(); const parts = e.target.dataset.rp.split(":"); arr.find(x=>x.id===parts[1])[parts[2]] = e.target.value; fullRerender(); }));
    document.querySelectorAll(`[data-rp-del^="${key}:"]`).forEach(b=>b.addEventListener("click", e=>{ pushHistory(); const id = e.currentTarget.dataset.rpDel.split(":")[1]; const i = arr.findIndex(x=>x.id===id); if(i>=0) arr.splice(i,1); fullRerender(); }));
    const add = document.querySelector(`[data-rp-add="${key}"]`); if(add) add.addEventListener("click", ()=>{ pushHistory(); arr.push(make()); fullRerender(); });
  });
  return html;
}

/* ================= presets modal ================= */
function openPresetsModal(){
  const grid = document.getElementById("presetGrid");
  let html = presetsFor().map(p => `<button class="preset-card" data-preset="${p.id}"><div class="pico"><i class='ic ic-${p.icon}'></i></div>${p.name}</button>`).join("");
  if(userTemplates.length){
    html += `<div style="grid-column:1/-1;font-size:11.5px;color:var(--text-muted);margin-top:6px;">قالب‌های من</div>`;
    html += userTemplates.map(t => `<div style="position:relative;"><button class="preset-card" style="width:100%;" data-utpl="${t.id}"><div class="pico"><i class='ic ic-star'></i></div>${escapeHtml(t.name)}</button><button class="icon-btn" style="position:absolute;top:6px;left:6px;width:22px;height:22px;font-size:10px;" data-utpl-del="${t.id}" title="حذف قالب"><i class='ic ic-x'></i></button></div>`).join("");
  }
  grid.innerHTML = html;
  const applyTpl = (fn, name) => {
    if(header.rows.length && !confirm("محتوای فعلی هدر جایگزین می‌شود. ادامه می‌دهی؟")) return;
    pushHistory(); header = fn(); selection = { kind:"header", id:null };
    document.getElementById("presetsModal").classList.add("hidden");
    fullRerender(); toast("قالب «" + name + "» بارگذاری شد");
  };
  grid.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => { const p = presetsFor().find(x=>x.id===b.dataset.preset); applyTpl(p.fn, p.name); }));
  grid.querySelectorAll("[data-utpl]").forEach(b => b.addEventListener("click", () => {
    const t = userTemplates.find(x=>x.id===b.dataset.utpl);
    applyTpl(() => { const d = normalizeDoc(clone(t.doc)); d.id = uid(); d.rows.forEach(regenIds); d.mobileRows.forEach(regenIds); return d; }, t.name);
  }));
  grid.querySelectorAll("[data-utpl-del]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation(); if(!confirm("این قالب حذف شود؟")) return;
    userTemplates = userTemplates.filter(x=>x.id!==b.dataset.utplDel);
    if(EMBED) parent.postMessage({hb:1,type:"delete-template",id:b.dataset.utplDel},"*");
    openPresetsModal();
  }));
  document.getElementById("presetsModal").classList.remove("hidden");
}
document.getElementById("presetsBtn").addEventListener("click", openPresetsModal);
document.getElementById("presetsClose").addEventListener("click", ()=> document.getElementById("presetsModal").classList.add("hidden"));
document.getElementById("presetsModal").addEventListener("click", e => { if(e.target.id==="presetsModal") e.target.classList.add("hidden"); });

function boxOverrideRules(id, rv, device, prop){
  if(!isOverridden(rv, device)) return "";
  const b = resolveRV(rv, device);
  return `#${id}{${prop}:${b.t}px ${b.r}px ${b.b}px ${b.l}px;}`;
}
function collectAllMenuItems(){
  let items = [];
  activeRows().forEach(r => r.columns.forEach(c => c.elements.forEach(e => { if(e.type==="menu") items = items.concat(e.content.items); })));
  return items;
}
function exportResponsiveCss(){
  let tablet = [], mobile = [];
  function walkEl(el){
    const s = el.style;
    ["width","height"].forEach(k=>{ if(isOverridden(s.layout[k],"tablet")) tablet.push(`#${el.id}{${k}:${resolveRV(s.layout[k],"tablet")}px;}`); if(isOverridden(s.layout[k],"mobile")) mobile.push(`#${el.id}{${k}:${resolveRV(s.layout[k],"mobile")}px;}`); });
    if(isOverridden(s.typography.fontSize,"tablet")) tablet.push(`#${el.id}{font-size:${resolveRV(s.typography.fontSize,"tablet")}px;}`);
    if(isOverridden(s.typography.fontSize,"mobile")) mobile.push(`#${el.id}{font-size:${resolveRV(s.typography.fontSize,"mobile")}px;}`);
    if(isOverridden(s.border.radius,"tablet")) tablet.push(`#${el.id}{border-radius:${resolveRV(s.border.radius,"tablet")}px;}`);
    if(isOverridden(s.border.radius,"mobile")) mobile.push(`#${el.id}{border-radius:${resolveRV(s.border.radius,"mobile")}px;}`);
    const pt = boxOverrideRules(el.id, s.spacing.padding, "tablet", "padding"); if(pt) tablet.push(pt);
    const pm = boxOverrideRules(el.id, s.spacing.padding, "mobile", "padding"); if(pm) mobile.push(pm);
    if(el.style.visibility.tablet===false) tablet.push(`#${el.id}{display:none !important;}`);
    if(el.style.visibility.mobile===false) mobile.push(`#${el.id}{display:none !important;}`);
  }
  function walkCol(col){
    if(isOverridden(col.width,"tablet")) tablet.push(`#${col.id}{flex:0 0 ${resolveRV(col.width,"tablet")}%;max-width:${resolveRV(col.width,"tablet")}%;}`);
    if(isOverridden(col.width,"mobile")) mobile.push(`#${col.id}{flex:0 0 ${resolveRV(col.width,"mobile")}%;max-width:${resolveRV(col.width,"mobile")}%;}`);
    if(isOverridden(col.layout.gap,"tablet")) tablet.push(`#${col.id}{gap:${resolveRV(col.layout.gap,"tablet")}px;}`);
    if(isOverridden(col.layout.gap,"mobile")) mobile.push(`#${col.id}{gap:${resolveRV(col.layout.gap,"mobile")}px;}`);
    if(col.visibility.tablet===false) tablet.push(`#${col.id}{display:none !important;}`);
    if(col.visibility.mobile===false) mobile.push(`#${col.id}{display:none !important;}`);
    col.elements.forEach(walkEl);
  }
  activeRows().forEach(row => {
    if(isOverridden(row.layout.gap,"tablet")) tablet.push(`#${row.id}{gap:${resolveRV(row.layout.gap,"tablet")}px;}`);
    if(isOverridden(row.layout.gap,"mobile")) mobile.push(`#${row.id}{gap:${resolveRV(row.layout.gap,"mobile")}px;}`);
    if(row.visibility.tablet===false) tablet.push(`#${row.id}{display:none !important;}`);
    if(row.visibility.mobile===false) mobile.push(`#${row.id}{display:none !important;}`);
    row.columns.forEach(walkCol);
  });
  return `@media (max-width:991px){ ${tablet.join(" ")} }\n@media (max-width:767px){ ${mobile.join(" ")} .hb-row>div{flex-wrap:wrap;} }`;
}

  const rootPos = autoCollapse && !stickyOn ? "position:relative;" : "";
  const html = `<div id="${rootId}" data-hb-root data-hb-sticky="${stickyOn?1:0}" data-hb-offset="${+header.sticky.offset||0}" data-hb-sbg="${escapeHtml(sbg)}" data-hb-shadow="${header.sticky.shadow?1:0}" class="${autoCollapse?"hb-auto-m":""}" style="${posCss}${rootPos}">${rowsHtml}${burger}</div>${drawer}${isFooter ? "" : renderBottomBarHtml(false)}`;
  const css = `

  ${DROPDOWN_AND_DRAWER_CSS}
  ${hoverCss}

  const js = HB_RUNTIME;
  return { html, css, js };
}

    window.parent.postMessage({hb:1, type:"doc", purpose:m.purpose, name:m.name, doc:clone(header), render:buildFragment()}, "*");

});
