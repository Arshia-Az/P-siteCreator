      if(b.posTop) outer += `top:${b.posTop};`;
      if(b.posRight) outer += `right:${b.posRight};`;
      if(b.posBottom) outer += `bottom:${b.posBottom};`;
      if(b.posLeft) outer += `left:${b.posLeft};`;
      if(b.zIndex) outer += `z-index:${b.zIndex};`;
    }
    if(b.fontFamily) inner += `font-family:${b.fontFamily};`;
    if(b.fontSize) inner += `font-size:${b.fontSize};`;
    if(b.fontWeight) inner += `font-weight:${b.fontWeight};`;
    if(b.textAlign) inner += `text-align:${b.textAlign};`;
    if(b.color) inner += `color:${b.color};`;
    if(b.bgColor) outer += `background-color:${b.bgColor};`;
    if(b.bgImage) outer += `background-image:url('${b.bgImage}');background-size:cover;background-position:center;`;
    if(b.borderWidth) outer += `border:${b.borderWidth}px ${b.borderStyle} ${b.borderColor};`;
    if(b.borderRadius) outer += `border-radius:${b.borderRadius}px;`;

    return { outer, inner };
  }
  function addBlock(type, variantId){
    let cellCount, extra = {};
    if(type === "flex"){
      const v = FLEX_VARIANTS.find(x=>x.id===variantId);
      cellCount = v.basis.length; extra.basis = v.basis;
    } else {
      const v = GRID_VARIANTS.find(x=>x.id===variantId);
      cellCount = v.cols*v.rows; extra.cols = v.cols; extra.rows = v.rows;
    }
    const layout = makeBlockLayout(type);
    if(type === "flex"){
      if(cellCount > 1) layout.direction.mobile = "column";
      if(cellCount >= 3) layout.wrap.tablet = "wrap";
    }
    currentBlocks().push({ id:uid(), type, variantId, boxed:true, effect:{effect:"none",speed:"normal",delay:0}, layout, box: makeBlockBox(), cells:newCellsArray(cellCount), ...extra });
    renderCanvas();
  }
  function deleteBlock(blockId){ const b=currentPage(); b.blocks = b.blocks.filter(x=>x.id!==blockId); renderCanvas(); }
  function toggleBoxed(blockId){ getBlock(blockId).boxed = !getBlock(blockId).boxed; renderCanvas(); }
  function setContent(blockId, cellId, content){ getCell(blockId, cellId).content = content; renderCanvas(); }
  function clearContent(blockId, cellId){ getCell(blockId, cellId).content = null; renderCanvas(); closePanel(); }

  /* ================= rendering ================= */
  const canvasEl = document.getElementById("canvas");
  const canvasWrapper = document.getElementById("canvasWrapper");
  const canvasScroll = document.getElementById("canvasScroll");

  const FONT_OPTIONS = [
    {v:"", t:"پیش‌فرض (Vazirmatn)"},
    {v:"Tahoma, sans-serif", t:"Tahoma"},
    {v:"Arial, sans-serif", t:"Arial"},
    {v:"Georgia, serif", t:"Georgia (سریف)"},
    {v:"'Courier New', monospace", t:"Courier New (تایپ‌رایتری)"},
    {v:"'Lalezar', cursive", t:"لعل‌زار (تزئینی)", google:"Lalezar"},
    {v:"'Aref Ruqaa', serif", t:"عارف رقعه (سنتی)", google:"Aref+Ruqaa"}
  ];
  function ensureFontLoaded(fontValue){
    const opt = FONT_OPTIONS.find(f=>f.v===fontValue);
    if(!opt || !opt.google) return;
    const id = "gf-" + opt.google;
    if(document.getElementById(id)) return;
    const link = document.createElement("link");
    link.id = id; link.rel = "stylesheet";
    link.href = `https://fonts.googleapis.com/css2?family=${opt.google}&display=swap`;
    document.head.appendChild(link);
  }
  function renderTextWidget(blockId, cellId, content, editable){
    const editAttr = editable ? `contenteditable="true" data-block="${blockId}" data-cell="${cellId}" data-role="text-value"` : "";
    if(content.fontFamily) ensureFontLoaded(content.fontFamily);
    const textStyle = `text-align:${content.align||"right"};${content.fontFamily?`font-family:${content.fontFamily};`:""}`;
    return `<div class="text-widget">
      <div class="text-block-editable" style="${textStyle}" ${editAttr}>${content.value || "<p>متن خود را وارد کنید</p>"}</div>
    </div>`;
  }
  const IMAGE_SIZE_PRESETS = { small:25, medium:50, large:75, full:100 };
  function renderImageWidget(blockId, cellId, content){
    const preset = content.sizePreset || "custom";
    const width = preset !== "custom" ? IMAGE_SIZE_PRESETS[preset] : (content.width || 100);
    const fit = content.fit || "cover";
    const maxH = content.maxHeight ? `max-height:${content.maxHeight}px;` : "";
    const imgTag = content.src
      ? `<img src="${escapeHtml(content.src)}" title="${escapeHtml(content.title||"")}" style="width:${width}%;object-fit:${fit};${maxH}" data-role="image-el" data-block="${blockId}" data-cell="${cellId}">`
      : `<div class="image-placeholder">${ICONS.image}<span>تصویری انتخاب نشده</span></div>`;
    const wrapped = content.src && content.link ? `<a href="${escapeHtml(content.link)}" target="_blank" rel="noopener">${imgTag}</a>` : imgTag;
    if(content.captionFontFamily) ensureFontLoaded(content.captionFontFamily);
    const capStyle = `text-align:${content.captionAlign||"right"};${content.captionFontFamily?`font-family:${content.captionFontFamily};`:""}`;
    const capTag = content.captionTag || "p";
    const caption = content.showCaption
      ? `<div class="cap"><${capTag} style="${capStyle}" contenteditable="true" data-block="${blockId}" data-cell="${cellId}" data-role="caption-value">${content.caption || "توضیح تصویر"}</${capTag}></div>` : "";
    return `<div class="image-widget">${wrapped}${caption}</div>`;
  }
  function renderVideoWidget(content){
    if(!content.src) return `<div class="media-placeholder">${ICONS.video} &nbsp; ویدیویی تنظیم نشده</div>`;
    if(/youtube\.com|youtu\.be/.test(content.src)){
      let embed = content.src.replace("watch?v=","embed/").replace("youtu.be/","youtube.com/embed/");
      return `<div style="position:relative;padding-top:56%;"><iframe src="${escapeHtml(embed)}" style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:6px;" allowfullscreen></iframe></div>`;
    }
    if(/aparat\.com/.test(content.src)){
      return `<div style="position:relative;padding-top:56%;"><iframe src="${escapeHtml(content.src)}" style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:6px;" allowfullscreen></iframe></div>`;
    }
    return `<video controls src="${escapeHtml(content.src)}"></video>`;
  }
  function renderAudioWidget(content){
    if(!content.src) return `<div class="media-placeholder">${ICONS.audio} &nbsp; فایل صوتی تنظیم نشده</div>`;
    return `<audio controls src="${escapeHtml(content.src)}"></audio>`;
  }
  function renderButtonWidget(content){
    const bg = content.bg || "#1c1f26", color = content.color || "#ffffff";
    const radius = content.radius != null ? content.radius : 8;
    return `<div class="btn-widget"><a href="${escapeHtml(content.link||"#")}" target="${content.target||"_self"}" style="background:${bg};color:${color};border-radius:${radius}px;">${escapeHtml(content.text||"دکمه من")}</a></div>`;
  }
  function renderIconWidget(content){
    const size = content.size || 32, color = content.color || "#1c1f26";
    const inner = `<span style="font-size:${size}px;color:${color};line-height:1;">${escapeHtml(content.glyph||"★")}</span>`;
    return `<div class="icon-widget">${content.link ? `<a href="${escapeHtml(content.link)}" target="${content.target||"_self"}">${inner}</a>` : inner}</div>`;
  }
  function renderDividerWidget(content){
    const thickness = content.thickness || 1, color = content.color || "#e2e4e9", widthPct = content.widthPct || 100, style = content.style || "solid";
    return `<div class="divider-widget"><hr style="border-top:${thickness}px ${style} ${color};width:${widthPct}%;margin-inline:${widthPct<100?"auto":"0"};"></div>`;
  }
  function renderHtmlWidget(content){
    if(!content.code || !content.code.trim()) return `<div class="html-widget-placeholder">${ICONS.html}&nbsp; کد HTML خالی است</div>`;
    return `<div class="html-widget">${content.code}</div>`;
  }

  function renderCellInner(blockId, cell){
    if(!cell.content){
      return `<div class="cell-empty-add"><button data-action="open-chooser" data-block="${blockId}" data-cell="${cell.id}" title="افزودن محتوا">${ICONS.plus}</button></div>`;
    }
    const c = cell.content;
    let body = "";
    if(c.type === "text") body = renderTextWidget(blockId, cell.id, c, true);
    else if(c.type === "image") body = renderImageWidget(blockId, cell.id, c);
    else if(c.type === "video") body = renderVideoWidget(c);
    else if(c.type === "audio") body = renderAudioWidget(c);
    else if(c.type === "button") body = renderButtonWidget(c);
    else if(c.type === "icon") body = renderIconWidget(c);
    else if(c.type === "divider") body = renderDividerWidget(c);
    else if(c.type === "html") body = renderHtmlWidget(c);
    const fx = c.effect || {effect:"none"};
    const fxOn = fx.effect && fx.effect !== "none";
    const fxReplayable = fxOn && isReplayableFx(fx.effect);
    return `<div class="cell-toolbar">
        <button class="cell-move-handle" draggable="true" data-move-block="${blockId}" data-move-cell="${cell.id}" title="جابه‌جایی به بخش دیگر">✥</button>
        ${fxReplayable ? `<button data-action="replay-effect" data-scope="cell" data-block="${blockId}" data-cell="${cell.id}" title="پیش‌نمایش افکت">↻</button>` : ""}
        <button class="on-${fxOn}" data-action="edit-content" data-block="${blockId}" data-cell="${cell.id}" title="تنظیمات">⚙</button>
        <button class="danger" data-action="delete-content" data-block="${blockId}" data-cell="${cell.id}" title="حذف">✕</button>
      </div>${fxOn ? `<div class="efx-badge">✨ ${fx.effect}</div>` : ""}${body}`;
  }

  function renderBlock(block){
    if(!block.layout) block.layout = makeBlockLayout(block.type);
    if(!block.box) block.box = makeBlockBox();
    const cls = block.boxed ? "boxed" : "full";
    const effType = effectiveContainerType(block);
    const stack = blockStacksCells(block);
    let rowHtml;
    if(effType === "flex"){
      ensureFlexBasis(block);
      const gapColResolved = resolveRV(block.layout.gapCol, device);
      const gapDeduct = (!stack && block.cells.length > 1) ? (gapColResolved * (block.cells.length-1) / block.cells.length) : 0;
      const cellsHtml = block.cells.map((cell,i) => {
        const basis = block.basis[i];
        const fx = cell.content && cell.content.effect ? fxAttrs(cell.content.effect) : {cls:"",attr:"",style:""};
        const sizeCss = stack ? `flex:1 1 auto;width:100%;` : `flex:0 0 calc(${basis}% - ${gapDeduct}px);`;
        return `<div class="cell has-content-${!!cell.content} ${fx.cls}" ${fx.attr} data-block="${block.id}" data-cell="${cell.id}" style="${sizeCss}${fx.style}">${renderCellInner(block.id, cell)}</div>`;
      }).join("");
      rowHtml = `<div class="row variant-${block.variantId||""}" style="${blockLayoutCss(block)}">${cellsHtml}</div>`;
    } else {
      ensureGridDims(block);
      const cellsHtml = block.cells.map(cell => {
        const fx = cell.content && cell.content.effect ? fxAttrs(cell.content.effect) : {cls:"",attr:"",style:""};
        return `<div class="cell ${fx.cls}" ${fx.attr} data-block="${block.id}" data-cell="${cell.id}" style="${fx.style}">${renderCellInner(block.id, cell)}</div>`;
      }).join("");
      rowHtml = `<div class="grid-row" style="${blockLayoutCss(block)}">${cellsHtml}</div>`;
    }
    const bfx = fxAttrs(block.effect);
    const bfxOn = block.effect && block.effect.effect && block.effect.effect !== "none";
    const bfxReplayable = bfxOn && isReplayableFx(block.effect.effect);
    const boxCss = blockBoxCss(block);
    const layoutBtnLabel = effType === "grid" ? "ویرایش شبکه‌ای" : "ویرایش فلکس‌باکس";
    return `<div class="block ${cls} ${bfx.cls}" ${bfx.attr} style="${bfx.style}${boxCss.outer}" data-block-id="${block.id}">
      <div class="block-toolbar">
        ${bfxReplayable ? `<button data-action="replay-effect" data-scope="block" data-block="${block.id}" title="پیش‌نمایش افکت">↻</button>` : ""}
        <button class="${bfxOn?'on':''}" data-action="open-block-fx" data-block="${block.id}" title="افکت بخش">✨</button>
        <button data-action="toggle-boxed" data-block="${block.id}" title="${block.boxed ? "تمام‌عرض کن" : "محدود به باکس کن"}">${block.boxed ? "⛶" : "▭"}</button>
        <button data-action="open-block-layout" data-block="${block.id}" title="${layoutBtnLabel}">▤</button>
        <button class="danger" data-action="delete-block" data-block="${block.id}" title="حذف بخش">🗑</button>
      </div>
      ${bfxOn ? `<div class="efx-badge">✨ ${block.effect.effect}</div>` : ""}
      <div class="block-inner" style="${boxCss.inner}">${rowHtml}</div>
    </div>`;
  }

  function renderCanvas(){
    if(currentPageId) touchPage(currentPageId);
    const blocks = currentBlocks();
    const page = currentPage();
    const headerHtml = `<div class="chrome-wrap hdr-wrap">${renderHeaderHtml(getEffectiveHeader(page))}<button class="chrome-shortcut" data-action="open-hf" data-hfkind="header">ویرایش هدر این صفحه</button></div>`;
    const footerHtml = `<div class="chrome-wrap ftr-wrap">${renderFooterHtml(getEffectiveFooter(page))}<button class="chrome-shortcut" data-action="open-hf" data-hfkind="footer">ویرایش فوتر این صفحه</button></div>`;
    let middleHtml;
    if(blocks.length === 0){
      middleHtml = `<div class="empty-state"><button class="big-add" data-action="open-layout-modal">${ICONS.plus}</button><p>برای شروع یک بخش اضافه کن</p></div>`;
    } else {
      middleHtml = blocks.map(renderBlock).join("") +
        `<div class="add-after"><button data-action="open-layout-modal" title="افزودن بخش">${ICONS.plus}</button></div>`;
    }
    canvasEl.innerHTML = headerHtml + middleHtml + footerHtml;
    checkImageWarnings();
    initEffects();
    initHeaderFooterBehavior(canvasEl);
  }

  function checkImageWarnings(){
    canvasEl.querySelectorAll('img[data-role="image-el"]').forEach(img => {
      img.addEventListener("load", function(){
        const ratio = img.naturalWidth / img.naturalHeight;
        const c = getCell(img.dataset.block, img.dataset.cell);
        if(c && c.content) c.content._warn = (ratio < 0.45 || ratio > 3) || img.naturalWidth > 2400;
      }, {once:true});
    });
  }

  /* ---------- effect engine ---------- */
  function runTypewriter(el){
    const t = el.querySelector('[data-role="text-value"]'); if(!t) return;
    const full = t.textContent; t.textContent = "";
    let i=0;
    const iv = setInterval(()=>{ t.textContent = full.slice(0,i+1); i++; if(i>=full.length) clearInterval(iv); }, 42);
  }
  function runLetterFade(el){
    const t = el.querySelector('[data-role="text-value"]'); if(!t) return;
    const full = t.textContent;
    t.innerHTML = full.split("").map((ch,i)=>`<span style="opacity:0;transition:opacity .4s ease;transition-delay:${i*28}ms;display:inline-block;">${ch===" "?"&nbsp;":escapeHtml(ch)}</span>`).join("");
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ t.querySelectorAll("span").forEach(s=>s.style.opacity=1); }); });
  }
  function runCountUp(el){
    const t = el.querySelector('[data-role="text-value"]'); if(!t) return;
    const raw = t.textContent.trim();
    const m = raw.match(/-?\d+(\.\d+)?/);
    if(!m) return;
    const target = parseFloat(m[0]); const prefix = raw.slice(0,m.index); const suffix = raw.slice(m.index+m[0].length);
    const dur = 1200; const start = performance.now();
    function step(now){
      const p = Math.min(1,(now-start)/dur);
      const val = target*p;
      t.textContent = prefix + (Number.isInteger(target) ? Math.round(val) : val.toFixed(1)) + suffix;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function attachTilt(el){
    const img = el.querySelector("img"); if(!img) return;
    el.addEventListener("mousemove", e=>{
      const r = el.getBoundingClientRect();
      const px = (e.clientX-r.left)/r.width-0.5, py = (e.clientY-r.top)/r.height-0.5;
      img.style.transform = `rotateY(${px*14}deg) rotateX(${-py*14}deg) scale(1.03)`;
    });
    el.addEventListener("mouseleave", ()=>{ img.style.transform=""; });
  }
  function attachHoverPlayPause(el){
    const v = el.querySelector("video"); if(!v) return;
    el.addEventListener("mouseenter", ()=>v.play().catch(()=>{}));
    el.addEventListener("mouseleave", ()=>v.pause());
  }
  function attachAudioPulse(el){
    const a = el.querySelector("audio"); if(!a) return;
    a.addEventListener("play", ()=>el.classList.add("audio-pulse-active"));
    a.addEventListener("pause", ()=>el.classList.remove("audio-pulse-active"));
    a.addEventListener("ended", ()=>el.classList.remove("audio-pulse-active"));
  }
  function runSpecialInView(el, fx){
    if(fx === "typewriter") runTypewriter(el);
    else if(fx === "letterFadeIn") runLetterFade(el);
    else if(fx === "countUp") runCountUp(el);
    else if(fx === "playOnView"){ const v = el.querySelector("video"); if(v){ v.muted=true; v.loop=true; v.play().catch(()=>{}); } }
  }

  let _efxObserver = null, _parallaxHandler = null, _parallaxEls = [];

  function initEffects(){
    if(_efxObserver) _efxObserver.disconnect();
    if(_parallaxHandler) canvasScroll.removeEventListener("scroll", _parallaxHandler);

    const inViewIds = [...ENTRANCE_IDS, "highlightSweep", "typewriter", "letterFadeIn", "countUp", "playOnView"];
    const targets = canvasEl.querySelectorAll(".efx-el[data-fx]");
    _efxObserver = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting) return;
        const el = entry.target, fx = el.dataset.fx;
        if(ENTRANCE_IDS.includes(fx) || fx === "highlightSweep") el.classList.add("efx-in");
        else runSpecialInView(el, fx);
        _efxObserver.unobserve(el);
      });
    }, { root: canvasScroll, threshold:0.2 });

    _parallaxEls = [];
    targets.forEach(el=>{
      const fx = el.dataset.fx;
      if(inViewIds.includes(fx)) _efxObserver.observe(el);
      if(fx === "tiltOnHover") attachTilt(el);
      if(fx === "hoverPlayPause") attachHoverPlayPause(el);
      if(fx === "pulseOnPlay") attachAudioPulse(el);
      if(fx === "parallax") _parallaxEls.push(el);
    });

    if(_parallaxEls.length){
      _parallaxHandler = () => {
        const rootR = canvasScroll.getBoundingClientRect(); const center = rootR.top + rootR.height/2;
        _parallaxEls.forEach(el=>{
          const r = el.getBoundingClientRect();
          const dist = (r.top + r.height/2) - center;
          const shift = Math.max(-24, Math.min(24, dist * -0.04));
          el.style.transform = `translateY(${shift}px)`;
        });
      };
      canvasScroll.addEventListener("scroll", _parallaxHandler);
      _parallaxHandler();
    }
  }

  function replayEffect(scope, blockId, cellId){
    let el;
    if(scope === "block"){
      el = canvasEl.querySelector(`.block[data-block-id="${blockId}"]`);
    } else {
      const blockEl = canvasEl.querySelector(`.block[data-block-id="${blockId}"]`);
      if(blockEl) el = [...blockEl.querySelectorAll(".cell")].find(c => {
        const btn = c.querySelector('[data-action="edit-content"]');
        return btn && btn.dataset.cell === cellId;
      });
    }
    if(!el) return;
    const fx = el.dataset.fx;
    if(!fx) return;
    const HOVER_PREVIEW = ["hoverLift","hoverScale","hoverZoom","hoverGrayscale","overlayReveal"];
    if(ENTRANCE_IDS.includes(fx) || fx === "highlightSweep"){
      el.classList.remove("efx-in"); void el.offsetWidth; el.classList.add("efx-in");
    } else if(["typewriter","letterFadeIn","countUp","playOnView"].includes(fx)){
      runSpecialInView(el, fx);
    } else if(HOVER_PREVIEW.includes(fx)){
      el.classList.remove("fx-preview"); void el.offsetWidth; el.classList.add("fx-preview");
      setTimeout(() => el.classList.remove("fx-preview"), 1300);
    } else if(fx === "tiltOnHover"){
      const img = el.querySelector("img"); if(!img) return;
      img.style.transition = "transform .3s ease";
      img.style.transform = "rotateY(10deg) rotateX(-6deg) scale(1.03)";
      setTimeout(() => { img.style.transform = ""; setTimeout(()=>{ img.style.transition=""; }, 320); }, 700);
    } else if(fx === "hoverPlayPause"){
      const v = el.querySelector("video"); if(v){ v.play().catch(()=>{}); setTimeout(()=>v.pause(), 1500); }
    } else if(fx === "pulseOnPlay"){
      el.classList.add("audio-pulse-active");
      setTimeout(() => el.classList.remove("audio-pulse-active"), 1800);
    }
    /* float / pulse / kenBurns / sticky / parallax: continuous or structural — no replay button is shown for these */
  }

  /* ================= canvas delegation ================= */
  canvasEl.addEventListener("click", function(e){
    const t = e.target.closest("[data-action]"); if(!t) return;
    const action = t.dataset.action, blockId = t.dataset.block, cellId = t.dataset.cell;
    if(action === "open-layout-modal") openLayoutModal();
    else if(action === "open-chooser") openPanelChooser(blockId, cellId);
    else if(action === "edit-content") openPanelSettings(blockId, cellId);
    else if(action === "delete-content") clearContent(blockId, cellId);
    else if(action === "delete-block") deleteBlock(blockId);
    else if(action === "toggle-boxed") toggleBoxed(blockId);
    else if(action === "open-block-fx") openBlockEffectPanel(blockId);
    else if(action === "open-block-layout") openBlockLayoutPanel(blockId);
    else if(action === "replay-effect") replayEffect(t.dataset.scope, blockId, cellId);
    else if(action === "open-hf") openHfModal(t.dataset.hfkind, "override", currentPageId);
  });
  canvasEl.addEventListener("input", function(e){
    if(e.target.matches('[data-role="text-value"]')) getCell(e.target.dataset.block, e.target.dataset.cell).content.value = e.target.innerHTML;
    else if(e.target.matches('[data-role="caption-value"]')) getCell(e.target.dataset.block, e.target.dataset.cell).content.caption = e.target.innerHTML;
  });

  /* preserve cursor position inside contenteditable text so panel controls (block-format select) can apply to it */
  let savedTextSelRange = null;
  function saveTextSelection(){
    const sel = window.getSelection();
    if(sel && sel.rangeCount > 0) savedTextSelRange = sel.getRangeAt(0).cloneRange();
  }
  function restoreTextSelection(){
    if(!savedTextSelRange) return;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedTextSelRange);
  }
  function getCellDomEl(blockId, cellId){
    return canvasEl.querySelector(`.cell[data-block="${blockId}"][data-cell="${cellId}"]`);
  }
  canvasEl.addEventListener("mouseup", e => { if(e.target.closest('[data-role="text-value"]')) saveTextSelection(); });
  canvasEl.addEventListener("keyup", e => { if(e.target.closest('[data-role="text-value"]')) saveTextSelection(); });

  /* drag placed content between cells */
  canvasEl.addEventListener("dragstart", function(e){
    const handle = e.target.closest(".cell-move-handle");
    if(!handle) return;
    dragMoveSource = { blockId: handle.dataset.moveBlock, cellId: handle.dataset.moveCell };
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", handle.dataset.moveCell);
  });
  canvasEl.addEventListener("dragend", function(){
    dragMoveSource = null;
    canvasEl.querySelectorAll(".cell-drop-target").forEach(c => c.classList.remove("cell-drop-target"));
  });
  canvasEl.addEventListener("dragover", function(e){
    const cell = e.target.closest(".cell"); if(!cell) return;
    const isFileDrag = e.dataTransfer && e.dataTransfer.types && Array.from(e.dataTransfer.types).includes("Files");
    if(!dragPaletteType && !dragMoveSource && !isFileDrag) return;
    if(dragMoveSource && cell.dataset.block === dragMoveSource.blockId && cell.dataset.cell === dragMoveSource.cellId) return;
    e.preventDefault();
    cell.classList.add("cell-drop-target");
  });
  canvasEl.addEventListener("dragleave", function(e){
    const cell = e.target.closest(".cell");
    if(cell) cell.classList.remove("cell-drop-target");
  });
  canvasEl.addEventListener("drop", function(e){
    const cell = e.target.closest(".cell"); if(!cell) return;
    const targetBlockId = cell.dataset.block, targetCellId = cell.dataset.cell;
    const files = e.dataTransfer && e.dataTransfer.files;
    if(files && files.length > 0 && files[0].type.indexOf("image/") === 0){
      e.preventDefault();
      cell.classList.remove("cell-drop-target");
      const file = files[0];
      const reader = new FileReader();
      reader.onload = ev => {
        const existing = getCell(targetBlockId, targetCellId);
        if(existing.content && existing.content.type === "image"){
          existing.content.src = ev.target.result;
        } else {
          const c = makeWidgetContent("image");
          c.src = ev.target.result;
          setContent(targetBlockId, targetCellId, c);
        }
        renderCanvas();
      };
      reader.readAsDataURL(file);
      return;
    }
    e.preventDefault();
    cell.classList.remove("cell-drop-target");
    if(dragPaletteType){
      setContent(targetBlockId, targetCellId, makeWidgetContent(dragPaletteType));
      dragPaletteType = null;
    } else if(dragMoveSource){
      if(dragMoveSource.blockId === targetBlockId && dragMoveSource.cellId === targetCellId){ dragMoveSource = null; return; }
      const srcCell = getCell(dragMoveSource.blockId, dragMoveSource.cellId);
      const tgtCell = getCell(targetBlockId, targetCellId);
      const tmp = tgtCell.content;
      tgtCell.content = srcCell.content;
      srcCell.content = tmp;
      dragMoveSource = null;
      renderCanvas();
    }
  });

  /* ================= device switch ================= */
  const deviceSeg = document.getElementById("deviceSeg");
  const deviceWidthLabel = document.getElementById("deviceWidthLabel");
  const widths = { desktop:"۱۳۲۰px", tablet:"۷۶۸px", mobile:"۳۹۰px" };
  deviceSeg.addEventListener("click", function(e){
    const b = e.target.closest("button[data-device]"); if(!b) return;
    device = b.dataset.device;
    deviceSeg.querySelectorAll("button").forEach(x=>x.classList.toggle("active", x===b));
    canvasWrapper.className = "canvas-wrapper device-" + device;
    deviceWidthLabel.textContent = widths[device];
    renderCanvas();
    if(currentPanelRefresh) currentPanelRefresh();
  });

  /* ================= layout modal ================= */
  const layoutModal = document.getElementById("layoutModal");
  const modalTabs = document.getElementById("modalTabs");
  const variantGrid = document.getElementById("variantGrid");
  let currentTab = "flex";
  function openLayoutModal(){ layoutModal.classList.remove("hidden"); renderVariants(); }
  function closeLayoutModal(){ layoutModal.classList.add("hidden"); }
  function renderVariants(){
    modalTabs.querySelectorAll("button").forEach(b=>b.classList.toggle("active", b.dataset.tab===currentTab));
    const list = currentTab === "flex" ? FLEX_VARIANTS : GRID_VARIANTS;
    variantGrid.innerHTML = list.map(v => {
      let preview;
      if(currentTab === "flex"){
        preview = `<div class="variant-preview">${v.basis.map(b=>`<span style="flex:0 0 calc(${b}% - 5px)">${toFa(Math.round(b))}٪</span>`).join("")}</div>`;
      } else {
        const n = v.cols*v.rows;
        preview = `<div class="variant-preview gridp" style="grid-template-columns:repeat(${v.cols},1fr)">${Array.from({length:n}).map(()=>"<span></span>").join("")}</div>`;
      }
      const sub = currentTab === "grid" ? `<div class="variant-sub">${toFa(v.cols*v.rows)} خانه</div>` : "";
      return `<div class="variant-card" data-variant="${v.id}">${preview}<div class="variant-label">${v.label}</div>${sub}</div>`;
    }).join("");
  }
  modalTabs.addEventListener("click", e => { const b=e.target.closest("button[data-tab]"); if(!b) return; currentTab=b.dataset.tab; renderVariants(); });
  variantGrid.addEventListener("click", e => { const card=e.target.closest(".variant-card"); if(!card) return; addBlock(currentTab, card.dataset.variant); closeLayoutModal(); });
  document.getElementById("layoutModalClose").addEventListener("click", closeLayoutModal);
  layoutModal.addEventListener("click", e => { if(e.target===layoutModal) closeLayoutModal(); });

  /* ================= side panel ================= */
  const sidePanel = document.getElementById("sidePanel");
  const panelTitle = document.getElementById("panelTitle");
  const panelBody = document.getElementById("panelBody");
  let currentPanelRefresh = null;
  let openPanelGroupIds = new Set(["pg-spacing"]);
  function closePanel(){ sidePanel.classList.remove("open"); activeCell = null; currentPanelRefresh = null; }
  document.getElementById("panelClose").addEventListener("click", closePanel);

  function openPanelChooser(blockId, cellId){
    activeCell = {blockId, cellId};
    panelTitle.textContent = "افزودن محتوا";
    panelBody.innerHTML = `
      <button class="widget-choice" draggable="true" data-widget="image">${ICONS.image} تصویر</button>
      <button class="widget-choice" draggable="true" data-widget="text">${ICONS.text} متن</button>
      <button class="widget-choice" draggable="true" data-widget="video">${ICONS.video} ویدیو</button>
      <button class="widget-choice" draggable="true" data-widget="audio">${ICONS.audio} صدا / ویس</button>
      <button class="widget-choice" draggable="true" data-widget="button">${ICONS.button} دکمه</button>
      <button class="widget-choice" draggable="true" data-widget="icon">${ICONS.icon} آیکون</button>
      <button class="widget-choice" draggable="true" data-widget="divider">${ICONS.divider} جداکننده</button>
      <button class="widget-choice" draggable="true" data-widget="html">${ICONS.html} کد HTML سفارشی</button>`;
    panelBody.querySelectorAll(".widget-choice").forEach(btn => {
      btn.addEventListener("click", () => {
        setContent(blockId, cellId, makeWidgetContent(btn.dataset.widget));
        openPanelSettings(blockId, cellId);
      });
      btn.addEventListener("dragstart", e => {
        e.dataTransfer.effectAllowed = "copy";
        e.dataTransfer.setData("text/plain", btn.dataset.widget);
        dragPaletteType = btn.dataset.widget;
      });
      btn.addEventListener("dragend", () => { dragPaletteType = null; });
    });
    sidePanel.classList.add("open");
  }
  function makeWidgetContent(type){
    const baseFx = {effect:"none", speed:"normal", delay:0};
    if(type === "text") return {type:"text", value:"<h3>عنوان</h3><p>متن خود را وارد کنید</p>", align:"right", fontFamily:"", effect:{...baseFx}};
    if(type === "image") return {type:"image", src:"", title:"", link:"", sizePreset:"full", width:100, fit:"cover", maxHeight:null, showCaption:false, caption:"", captionTag:"p", captionAlign:"right", captionFontFamily:"", effect:{...baseFx}};
    if(type === "video") return {type:"video", src:"", effect:{...baseFx}};
    if(type === "audio") return {type:"audio", src:"", effect:{...baseFx}};
    if(type === "button") return {type:"button", text:"دکمه من", link:"#", target:"_self", bg:"#1c1f26", color:"#ffffff", radius:8, effect:{...baseFx}};
    if(type === "icon") return {type:"icon", glyph:"★", size:32, color:"#1c1f26", link:"", target:"_self", effect:{...baseFx}};
    if(type === "divider") return {type:"divider", thickness:1, color:"#e2e4e9", widthPct:100, style:"solid", effect:{...baseFx}};
    if(type === "html") return {type:"html", code:"", effect:{...baseFx}};
    return {type, effect:{...baseFx}};
  }

  function topDisplayBucket(v){ return (v==="inline-block"||v==="inline-flex") ? "more" : v; }
  function openBlockLayoutPanel(blockId){
    activeCell = null;
    currentPanelRefresh = () => openBlockLayoutPanel(blockId);
    /* snapshot which accordions are currently open in the live DOM before we rebuild,
       so editing a field doesn't snap every section shut */
    const liveGroups = panelBody.querySelectorAll('.panel-group[data-pg]');
    if(liveGroups.length) openPanelGroupIds = new Set([...liveGroups].filter(d=>d.open).map(d=>d.dataset.pg));
    const block = getBlock(blockId);
    if(!block.layout) block.layout = makeBlockLayout(block.type);
    if(!block.box) block.box = makeBlockBox();
    const l = block.layout, b = block.box;
    const ct = resolveRV(l.containerType, device);
    panelTitle.textContent = ct === "grid" ? "ویرایش شبکه‌ای" : "ویرایش فلکس‌باکس";

    const refresh = () => { renderCanvas(); openBlockLayoutPanel(blockId); };
    const wires = [];
    function devTag(){ return device === "desktop" ? "" : ` <span style="color:#6d7484;font-size:10px;">(${device==="tablet"?"تبلت":"موبایل"}${""})</span>`; }
    function resetBtn(id, rv){ return isRVOverridden(rv, device) ? ` <button type="button" id="rst${id}" class="reset-inherit">بازنشانی</button>` : ""; }

    function segField(label, rv, options){
      const id = uid();
      const val = resolveRV(rv, device);
      const htmlStr = `<div class="field"><label>${label}${devTag()}${resetBtn(id,rv)}</label>
        <div class="btn-group" id="${id}">${options.map(o=>`<button type="button" data-v="${o.v}" class="${o.v===val?"active":""}">${o.t}</button>`).join("")}</div></div>`;
      wires.push(() => {
        document.querySelectorAll(`#${id} [data-v]`).forEach(btn => btn.addEventListener("click", () => { rv[device] = btn.dataset.v; refresh(); }));
        const rst = document.getElementById("rst"+id); if(rst) rst.addEventListener("click", () => { rv[device] = null; refresh(); });
      });
      return htmlStr;
    }
    function selectField(label, rv, options){
      const id = uid();
      const val = resolveRV(rv, device);
      const htmlStr = `<div class="field"><label>${label}${devTag()}${resetBtn(id,rv)}</label>
        <select id="${id}">${options.map(o=>`<option value="${o.v}" ${o.v===val?"selected":""}>${o.t}</option>`).join("")}</select></div>`;
      wires.push(() => {
        document.getElementById(id).addEventListener("change", e => { rv[device] = e.target.value; refresh(); });
        const rst = document.getElementById("rst"+id); if(rst) rst.addEventListener("click", () => { rv[device] = null; refresh(); });
      });
      return htmlStr;
    }
    function numberField(label, rv, opts){
      opts = opts || {};
      const id = uid();
      const val = resolveRV(rv, device);
      const htmlStr = `<div class="field"><label>${label}${devTag()}${resetBtn(id,rv)}</label>
        <input type="number" id="${id}" value="${val==null?"":val}" min="${opts.min!=null?opts.min:0}" ${opts.max!=null?`max="${opts.max}"`:""}></div>`;
      wires.push(() => {
        document.getElementById(id).addEventListener("change", e => { rv[device] = e.target.value===""?null:(+e.target.value||0); refresh(); });
        const rst = document.getElementById("rst"+id); if(rst) rst.addEventListener("click", () => { rv[device] = null; refresh(); });
      });
      return htmlStr;
    }
    function sizeField(label, rv){
      const id = uid();
      const val = resolveRV(rv, device) || {value:"",unit:"px"};
      const htmlStr = `<div class="field"><label>${label}${devTag()}${resetBtn(id,rv)}</label>
        <div class="row2">
          <input type="number" id="${id}v" value="${val.value}" placeholder="مقدار">
          <select id="${id}u">${UNIT_OPTIONS.map(u=>`<option value="${u}" ${u===val.unit?"selected":""}>${u}</option>`).join("")}</select>
        </div></div>`;
      wires.push(() => {
        const commit = () => {
          const v = document.getElementById(id+"v").value, u = document.getElementById(id+"u").value;
          rv[device] = v===""?null:{value:v,unit:u};
          refresh();
        };
        document.getElementById(id+"v").addEventListener("change", commit);
        document.getElementById(id+"u").addEventListener("change", commit);
        const rst = document.getElementById("rst"+id); if(rst) rst.addEventListener("click", () => { rv[device] = null; refresh(); });
      });
      return htmlStr;
    }
    function spacingField(label, rv){
      const id = uid();
      const val = resolveRV(rv, device) || {t:0,r:0,b:0,l:0};
      const htmlStr = `<div class="field"><label>${label} (بالا راست پایین چپ)${devTag()}${resetBtn(id,rv)}</label>
        <div class="row4">
          <input type="number" id="${id}t" value="${val.t}"><input type="number" id="${id}r" value="${val.r}">
          <input type="number" id="${id}b" value="${val.b}"><input type="number" id="${id}l" value="${val.l}">
        </div></div>`;
      wires.push(() => {
        ["t","r","b","l"].forEach(k => {
          document.getElementById(id+k).addEventListener("change", () => {
            const cur = resolveRV(rv, device) || {t:0,r:0,b:0,l:0};
            const next = Object.assign({}, cur);
            const raw = document.getElementById(id+k).value;
            next[k] = raw===""?0:(+raw||0);
            rv[device] = next;
            refresh();
          });
        });
        const rst = document.getElementById("rst"+id); if(rst) rst.addEventListener("click", () => { rv[device] = null; refresh(); });
      });
      return htmlStr;
    }
    function paddingField(label, rv){
      const id = uid();
      const val = resolveRV(rv, device);
      const v = val || {t:"",r:"",b:"",l:""};
      const htmlStr = `<div class="field"><label>${label} — خالی یعنی پیش‌فرض${devTag()}${resetBtn(id,rv)}</label>
        <div class="row4">
          <input type="number" id="${id}t" value="${v.t}" placeholder="بالا"><input type="number" id="${id}r" value="${v.r}" placeholder="راست">
          <input type="number" id="${id}b" value="${v.b}" placeholder="پایین"><input type="number" id="${id}l" value="${v.l}" placeholder="چپ">
        </div></div>`;
      wires.push(() => {
        ["t","r","b","l"].forEach(k => {
          document.getElementById(id+k).addEventListener("change", () => {
            const cur = resolveRV(rv, device) || {t:0,r:0,b:0,l:0};
            const next = Object.assign({}, cur);
            const raw = document.getElementById(id+k).value;
            next[k] = raw===""?0:(+raw||0);
            rv[device] = next;
            refresh();
          });
        });
        const rst = document.getElementById("rst"+id); if(rst) rst.addEventListener("click", () => { rv[device] = null; refresh(); });
      });
      return htmlStr;
    }

    /* ===== Container section ===== */
    let html = `<div class="layout-section-title">کانتینر</div>`;
    html += segField("چیدمان کانتینر", l.containerType, [{v:"grid",t:"شبکه‌ای"},{v:"flex",t:"فلکس‌باکس"}]);
    const contentWidthId = uid();
    html += `<div class="field"><label>عرض محتوا</label><div class="btn-group" id="${contentWidthId}">
        <button type="button" data-cw="boxed" class="${block.boxed?"active":""}">جعبه‌ای</button>
        <button type="button" data-cw="full" class="${!block.boxed?"active":""}">تمام صفحه</button>
      </div></div>`;
    wires.push(() => {
      document.querySelectorAll(`#${contentWidthId} [data-cw]`).forEach(btn => btn.addEventListener("click", () => { block.boxed = btn.dataset.cw === "boxed"; refresh(); }));
    });
    if(block.boxed) html += sizeField("عرض", l.width);
    else html += `<div class="mini-note">عرض در حالت «تمام صفحه» قفل است — فقط کمترین ارتفاع قابل تغییر است.</div>`;
    html += sizeField("کمترین ارتفاع", l.minHeight);

    /* ===== Items section (variable, based on container type) ===== */
    html += `<div class="layout-section-title">آیتم‌ها</div>`;
    if(ct === "grid"){
      ensureGridDims(block);
      const colsId = uid(), rowsId = uid();
      html += `<div class="field"><label>طرح کلی شبکه — تعداد ستون و ردیف (۱ تا ۱۲)</label>
        <div class="row2">
          <input type="number" id="${colsId}" min="1" max="12" value="${block.cols}" placeholder="ستون‌ها">
          <input type="number" id="${rowsId}" min="1" max="12" value="${block.rows}" placeholder="ردیف‌ها">
        </div></div>`;
      wires.push(() => {
        const commitGrid = () => {
          const cols = Math.max(1, Math.min(12, +document.getElementById(colsId).value || 1));
          const rows = Math.max(1, Math.min(12, +document.getElementById(rowsId).value || 1));
          resizeGridCells(block, cols, rows);
          refresh();
        };
        document.getElementById(colsId).addEventListener("change", commitGrid);
        document.getElementById(rowsId).addEventListener("change", commitGrid);
      });
      html += `<div class="layout-section-title" style="border-top:none;padding-top:0;">فاصله‌ها</div>`;
      html += `<div class="row2">${numberField("ستون‌ها", l.gapCol, {min:0})}${numberField("ردیف‌ها", l.gapRow, {min:0})}</div>`;
      html += selectField("جریان خودکار (Auto Flow)", l.gridAutoFlow, [{v:"row",t:"ردیفی (Row)"},{v:"column",t:"ستونی (Column)"},{v:"dense",t:"فشرده (Dense)"}]);
      html += selectField("ترازبندی آیتم‌ها (Align Items)", l.gridAlignItems, [{v:"stretch",t:"کشیده"},{v:"start",t:"شروع"},{v:"center",t:"وسط"},{v:"end",t:"پایان"}]);
      html += selectField("تراز آیتم‌ها (Justify Items)", l.gridJustifyItems, [{v:"stretch",t:"کشیده"},{v:"start",t:"شروع"},{v:"center",t:"وسط"},{v:"end",t:"پایان"}]);
    } else {
      html += selectField("جهت‌یابی (Direction)", l.direction, [
        {v:"row",t:"ردیف (Row)"},{v:"row-reverse",t:"ردیف معکوس"},{v:"column",t:"ستون (Column)"},{v:"column-reverse",t:"ستون معکوس"}
      ]);
      html += selectField("هم‌ترازی محتوا (Justify Content)", l.justify, [
        {v:"flex-start",t:"شروع"},{v:"center",t:"وسط"},{v:"flex-end",t:"پایان"},{v:"space-between",t:"فاصله بین"},{v:"space-around",t:"فاصله اطراف"},{v:"space-evenly",t:"فاصله یکسان"}
      ]);
      html += selectField("تراز آیتم‌ها (Align Items)", l.alignItems, [
        {v:"stretch",t:"کشیده"},{v:"flex-start",t:"شروع"},{v:"center",t:"وسط"},{v:"flex-end",t:"پایان"},{v:"baseline",t:"خط پایه"}
      ]);
      html += `<div class="layout-section-title" style="border-top:none;padding-top:0;">فاصله‌ها</div>`;
      html += `<div class="row2">${numberField("ستون‌ها", l.gapCol, {min:0})}${numberField("ردیف‌ها", l.gapRow, {min:0})}</div>`;
      html += segField("شکست خطوط (Wrap)", l.wrap, [{v:"nowrap",t:"بدون پیچش"},{v:"wrap",t:"پیچش"},{v:"wrap-reverse",t:"پیچش معکوس"}]);
      if(resolveRV(l.wrap,device) !== "nowrap"){
        html += selectField("تراز محتوا (Align Content)", l.alignContent, [
          {v:"flex-start",t:"شروع"},{v:"center",t:"وسط"},{v:"flex-end",t:"پایان"},{v:"space-between",t:"فاصله بین"},{v:"space-around",t:"فاصله اطراف"},{v:"stretch",t:"کشیده"}
        ]);
      }
    }

    /* ===== shared accordions ===== */
    const pgOpen = id => openPanelGroupIds.has(id) ? "open" : "";
    html += `<details class="panel-group" data-pg="pg-spacing" ${pgOpen("pg-spacing")}><summary>فاصله‌گذاری</summary><div class="panel-group-body" id="pg-spacing"></div></details>`;
    html += `<details class="panel-group" data-pg="pg-size" ${pgOpen("pg-size")}><summary>اندازه</summary><div class="panel-group-body" id="pg-size"></div></details>`;
    html += `<details class="panel-group" data-pg="pg-position" ${pgOpen("pg-position")}><summary>جایگاه</summary><div class="panel-group-body" id="pg-position"></div></details>`;
    html += `<details class="panel-group" data-pg="pg-typo" ${pgOpen("pg-typo")}><summary>تایپوگرافی</summary><div class="panel-group-body" id="pg-typo"></div></details>`;
    html += `<details class="panel-group" data-pg="pg-bg" ${pgOpen("pg-bg")}><summary>پس‌زمینه</summary><div class="panel-group-body" id="pg-bg"></div></details>`;
    html += `<details class="panel-group" data-pg="pg-border" ${pgOpen("pg-border")}><summary>حاشیه</summary><div class="panel-group-body" id="pg-border"></div></details>`;

    panelBody.innerHTML = html;
    wires.forEach(w => w());
    document.querySelectorAll('.panel-group[data-pg]').forEach(det => {
      det.addEventListener("toggle", () => {
        if(det.open) openPanelGroupIds.add(det.dataset.pg);
        else openPanelGroupIds.delete(det.dataset.pg);
      });
    });

    /* --- spacing (responsive) --- */
    const spacingWires = [];
    const savedWires1 = wires.length;
    const spacingHtml = spacingField("Margin", b.margin) + paddingField("Padding", b.padding);
    spacingWires.push(...wires.splice(savedWires1));
    document.getElementById("pg-spacing").innerHTML = spacingHtml;
    spacingWires.forEach(fn => fn());

    /* --- size (responsive + unit) --- */
    const sizeWires = [];
    const savedWires2 = wires.length;
    const sizeHtml = sizeField("عرض", b.width) + sizeField("حداقل ارتفاع", b.minHeight) + sizeField("حداکثر عرض", b.maxWidth);
    sizeWires.push(...wires.splice(savedWires2));
    document.getElementById("pg-size").innerHTML = sizeHtml;
    sizeWires.forEach(fn => fn());

    /* --- position (not responsive, kept simple) --- */
    let posHtml = `<div class="field"><label>موقعیت (Position)</label>
      <select id="pf-position">
        <option value="static" ${b.position==="static"?"selected":""}>عادی (Static)</option>
        <option value="relative" ${b.position==="relative"?"selected":""}>نسبی (Relative)</option>
        <option value="absolute" ${b.position==="absolute"?"selected":""}>مطلق (Absolute)</option>
        <option value="fixed" ${b.position==="fixed"?"selected":""}>ثابت (Fixed)</option>
        <option value="sticky" ${b.position==="sticky"?"selected":""}>چسبان (Sticky)</option>
      </select></div>`;
    if(b.position !== "static"){
      posHtml += `<div class="row2">
          <div class="field"><label>Top</label><input type="text" id="pf-pos-top" value="${escapeHtml(b.posTop)}"></div>
          <div class="field"><label>Right</label><input type="text" id="pf-pos-right" value="${escapeHtml(b.posRight)}"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Bottom</label><input type="text" id="pf-pos-bottom" value="${escapeHtml(b.posBottom)}"></div>
          <div class="field"><label>Left</label><input type="text" id="pf-pos-left" value="${escapeHtml(b.posLeft)}"></div>
        </div>
        <div class="field"><label>z-index</label><input type="number" id="pf-zindex" value="${escapeHtml(b.zIndex)}"></div>`;
    }
    document.getElementById("pg-position").innerHTML = posHtml;
    document.getElementById("pf-position").addEventListener("change", e => { b.position = e.target.value; refresh(); });
    const posTop = document.getElementById("pf-pos-top"); if(posTop) posTop.addEventListener("change", e => { b.posTop = e.target.value; renderCanvas(); });

  function openBlockEffectPanel(blockId){
    activeCell = null;
    const block = getBlock(blockId);
    panelTitle.textContent = "افکت بخش";
    panelBody.innerHTML = `
      ${buildEffectFieldHTML("block", block.effect)}
      <div class="panel-divider"></div>
      <div class="replay-inline"><span>پیش‌نمایش:</span><button id="pf-replay">اجرای مجدد افکت</button></div>
    `;
    attachEffectFieldEvents(panelBody, () => { readEffectFieldsFrom(panelBody, block.effect); renderCanvas(); openBlockEffectPanel(blockId); });
    const replayBtn = document.getElementById("pf-replay");
    if(replayBtn) replayBtn.addEventListener("click", () => replayEffect("block", blockId));
    sidePanel.classList.add("open");
  }

    if(content.type === "text"){

      document.getElementById("pf-src").addEventListener("change", e => { content.src = e.target.value; refresh(); });
      document.getElementById("pf-file").addEventListener("change", e => {
        const f = e.target.files[0]; if(!f) return;
        const reader = new FileReader();
        reader.onload = ev => { content.src = ev.target.result; refresh(); };

        ${buildEffectFieldHTML("audio", content.effect)}
        <div class="replay-inline"><span>پیش‌نمایش:</span><button id="pf-replay">اجرای مجدد افکت</button></div>

  function exportEffectAttrs(fx){
    if(!fx || !fx.effect || fx.effect === "none") return "";
    const dur = SPEED_MS[fx.speed||"normal"];
    const isEntrance = ENTRANCE_IDS.includes(fx.effect);
    const style = isEntrance ? ` style="transition-duration:${dur}ms;transition-delay:${fx.delay||0}ms;"` : "";
    return ` class="efx-el" data-fx="${fx.effect}"${style}`;
  }
  function exportWidgetHtml(content){
    const fxAttr = exportEffectAttrs(content.effect);
    if(content.type === "text"){
      const style = `text-align:${content.align||"right"};${content.fontFamily?`font-family:${content.fontFamily};`:""}`;
      return `<div${fxAttr} style="${style}">${content.value || ""}</div>`;
    }
    if(content.type === "image"){
      const preset = content.sizePreset || "custom";
      const width = preset !== "custom" ? IMAGE_SIZE_PRESETS[preset] : (content.width||100);
      const fit = content.fit||"cover";
      const maxH = content.maxHeight ? `max-height:${content.maxHeight}px;` : "";
      let img = `<img src="${escapeHtml(content.src)}" title="${escapeHtml(content.title||"")}" alt="${escapeHtml(content.title||"")}" style="width:${width}%;object-fit:${fit};${maxH}display:block;border-radius:4px;">`;
      if(content.link) img = `<a href="${escapeHtml(content.link)}">${img}</a>`;
      const capStyle = `font-size:14px;color:#666;margin-top:8px;text-align:${content.captionAlign||"right"};${content.captionFontFamily?`font-family:${content.captionFontFamily};`:""}`;
      const cap = content.showCaption ? `<${content.captionTag||"p"} style="${capStyle}">${content.caption||""}</${content.captionTag||"p"}>` : "";
      return `<div${fxAttr}>${img}${cap}</div>`;
    }
    if(content.type === "video"){
      if(!content.src) return "";
      if(/youtube\.com|youtu\.be/.test(content.src)){
        const embed = content.src.replace("watch?v=","embed/").replace("youtu.be/","youtube.com/embed/");
        return `<div${fxAttr} style="position:relative;padding-top:56%;"><iframe src="${escapeHtml(embed)}" style="position:absolute;inset:0;width:100%;height:100%;border:0;" allowfullscreen></iframe></div>`;
      }
      return `<video controls${fxAttr} src="${escapeHtml(content.src)}" style="width:100%;display:block;"></video>`;
    }
    if(content.type === "audio"){
      return content.src ? `<audio controls${fxAttr} src="${escapeHtml(content.src)}" style="width:100%;"></audio>` : "";
    }
    if(content.type === "button"){
      const radius = content.radius!=null?content.radius:8;
      return `<a${fxAttr} href="${escapeHtml(content.link||"#")}" target="${content.target||"_self"}" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;padding:10px 20px;border-radius:${radius}px;font-size:14px;font-weight:600;background:${content.bg||"#1c1f26"};color:${content.color||"#fff"};">${escapeHtml(content.text||"دکمه")}</a>`;
    }
    if(content.type === "icon"){
      const inner = `<span style="font-size:${content.size||32}px;color:${content.color||"#1c1f26"};line-height:1;display:inline-block;">${escapeHtml(content.glyph||"★")}</span>`;
      return content.link ? `<a${fxAttr} href="${escapeHtml(content.link)}" target="${content.target||"_self"}">${inner}</a>` : `<div${fxAttr}>${inner}</div>`;
    }
    if(content.type === "divider"){
      const widthPct = content.widthPct||100;
      return `<hr${fxAttr} style="border-top:${content.thickness||1}px ${content.style||"solid"} ${content.color||"#e2e4e9"};width:${widthPct}%;margin-inline:${widthPct<100?"auto":"0"};">`;
    }
    if(content.type === "html"){
      return `<div${fxAttr}>${content.code||""}</div>`;
    }
    return "";
  }
  function exportBlockHtml(block){
    const padCls = block.boxed ? `max-width:1080px;margin:0 auto;padding:26px 28px;` : `padding:26px 20px;`;
    let inner;
    if(block.type === "flex"){
      const cells = block.cells.map((cell,i) => `<div class="cell" style="flex:0 0 calc(${block.basis[i]}% - 18px)">${cell.content ? exportWidgetHtml(cell.content) : ""}</div>`).join("");
      inner = `<div class="row" style="display:flex;gap:18px;">${cells}</div>`;
    } else {
      const cells = block.cells.map(cell => `<div class="cell">${cell.content ? exportWidgetHtml(cell.content) : ""}</div>`).join("");
      inner = `<div class="grid-row" style="display:grid;gap:18px;grid-template-columns:repeat(${block.cols},1fr);">${cells}</div>`;
    }
    const fxAttr = exportEffectAttrs(block.effect);
    return `<section${fxAttr} style="${padCls}">${inner}</section>`;
  }

  .efx-el[data-fx="zoomIn"]{opacity:0;transform:scale(.82);}
  .efx-el[data-fx="zoomOut"]{opacity:0;transform:scale(1.18);}
  .efx-el[data-fx="slideInUp"]{transform:translateY(80px);}
  .efx-el[data-fx="flipInX"]{opacity:0;transform:perspective(700px) rotateX(65deg);}
  .efx-el[data-fx="rotateIn"]{opacity:0;transform:rotate(-10deg) scale(.92);}
  .efx-el[data-fx="bounceIn"]{opacity:0;transform:scale(.5);transition-timing-function:cubic-bezier(.34,1.56,.64,1);}
  .efx-el.efx-in{opacity:1 !important;transform:none !important;}
  .efx-el[data-fx="hoverLift"]:hover,.efx-el[data-fx="hoverLift"].fx-preview{transform:translateY(-8px);box-shadow:0 20px 40px -18px #00000055;}
  .efx-el[data-fx="hoverScale"]:hover,.efx-el[data-fx="hoverScale"].fx-preview{transform:scale(1.015);}
  @keyframes efxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .efx-el[data-fx="float"]{animation:efxFloat 3.4s ease-in-out infinite;}
  @keyframes efxPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  .efx-el[data-fx="pulse"]{animation:efxPulse 2.2s ease-in-out infinite;}
  .efx-el[data-fx="sticky"]{position:sticky;top:0;z-index:30;}
  .efx-el[data-fx="hoverZoom"]{overflow:hidden;border-radius:4px;}
  .efx-el[data-fx="hoverZoom"] img{transition:transform .5s ease;}
  .efx-el[data-fx="hoverZoom"]:hover img,.efx-el[data-fx="hoverZoom"].fx-preview img{transform:scale(1.1);}
  .efx-el[data-fx="hoverGrayscale"] img{filter:grayscale(1);transition:filter .5s ease;}
  .efx-el[data-fx="hoverGrayscale"]:hover img,.efx-el[data-fx="hoverGrayscale"].fx-preview img{filter:grayscale(0);}
  .efx-el[data-fx="kenBurns"]{overflow:hidden;border-radius:4px;}
  @keyframes efxKen{from{transform:scale(1)}to{transform:scale(1.15)}}
  .efx-el[data-fx="kenBurns"] img{animation:efxKen 10s ease-in-out infinite alternate;}
  .efx-el[data-fx="tiltOnHover"] img{transition:transform .1s ease;}
  .efx-el[data-fx="overlayReveal"]{position:relative;overflow:hidden;border-radius:4px;}
  .efx-el[data-fx="overlayReveal"]::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000000aa,transparent 55%);opacity:0;transition:opacity .4s ease;}
  .efx-el[data-fx="overlayReveal"]:hover::after,.efx-el[data-fx="overlayReveal"].fx-preview::after{opacity:1;}
  .efx-el[data-fx="highlightSweep"]{background-image:linear-gradient(#fce8b8,#fce8b8);background-repeat:no-repeat;background-position:right bottom;background-size:0% 40%;transition:background-size .8s ease;padding:0 2px;}
  .efx-el[data-fx="highlightSweep"].efx-in{background-size:100% 40%;}
  @keyframes efxAudioPulse{0%,100%{box-shadow:0 0 0 0 #f2a63a55}50%{box-shadow:0 0 0 8px #f2a63a00}}
  .audio-pulse-active{animation:efxAudioPulse 1.4s ease-in-out infinite;border-radius:8px;}
  `;

  const EXPORT_EFFECT_JS = `
  (function(){
    var ENTRANCE = ["fadeIn","fadeInUp","fadeInDown","fadeInLeft","fadeInRight","zoomIn","zoomOut","slideInUp","flipInX","rotateIn","bounceIn"];
    function runTypewriter(el){ var t=el; var full=t.textContent; t.textContent=""; var i=0; var iv=setInterval(function(){ t.textContent=full.slice(0,i+1); i++; if(i>=full.length) clearInterval(iv); },42); }
    function runLetterFade(el){ var full=el.textContent; el.innerHTML = full.split("").map(function(ch,i){ return '<span style="opacity:0;transition:opacity .4s ease;transition-delay:'+(i*28)+'ms;display:inline-block;">'+(ch===" "?"&nbsp;":ch)+'</span>'; }).join(""); requestAnimationFrame(function(){ requestAnimationFrame(function(){ var sp=el.querySelectorAll("span"); for(var i=0;i<sp.length;i++) sp[i].style.opacity=1; }); }); }
    function runCountUp(el){ var raw=el.textContent.trim(); var m=raw.match(/-?\\d+(\\.\\d+)?/); if(!m) return; var target=parseFloat(m[0]); var prefix=raw.slice(0,m.index); var suffix=raw.slice(m.index+m[0].length); var dur=1200; var start=performance.now(); function step(now){ var p=Math.min(1,(now-start)/dur); var val=target*p; el.textContent = prefix + (Number.isInteger(target)?Math.round(val):val.toFixed(1)) + suffix; if(p<1) requestAnimationFrame(step); } requestAnimationFrame(step); }
    var els = document.querySelectorAll(".efx-el[data-fx]");
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting) return;
        var el = entry.target, fx = el.dataset.fx;
        if(ENTRANCE.indexOf(fx) !== -1 || fx === "highlightSweep") el.classList.add("efx-in");
        else if(fx === "typewriter") runTypewriter(el);
        else if(fx === "letterFadeIn") runLetterFade(el);
        else if(fx === "countUp") runCountUp(el);
        else if(fx === "playOnView"){ var v=el.tagName==="VIDEO"?el:el.querySelector("video"); if(v){ v.muted=true; v.loop=true; v.play().catch(function(){}); } }
        obs.unobserve(el);
      });
    }, {threshold:0.2});
    var parallaxEls = [];
    els.forEach(function(el){
      var fx = el.dataset.fx;
      if(["fadeIn","fadeInUp","fadeInDown","fadeInLeft","fadeInRight","zoomIn","zoomOut","slideInUp","flipInX","rotateIn","bounceIn","highlightSweep","typewriter","letterFadeIn","countUp","playOnView"].indexOf(fx)!==-1) obs.observe(el);
      if(fx === "tiltOnHover"){ var img=el.querySelector("img"); if(img){ el.addEventListener("mousemove",function(e){ var r=el.getBoundingClientRect(); var px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5; img.style.transform="rotateY("+(px*14)+"deg) rotateX("+(-py*14)+"deg) scale(1.03)"; }); el.addEventListener("mouseleave",function(){ img.style.transform=""; }); } }
      if(fx === "hoverPlayPause"){ var v2=el.tagName==="VIDEO"?el:el.querySelector("video"); if(v2){ el.addEventListener("mouseenter",function(){ v2.play().catch(function(){}); }); el.addEventListener("mouseleave",function(){ v2.pause(); }); } }
      if(fx === "pulseOnPlay"){ var a=el.tagName==="AUDIO"?el:el.querySelector("audio"); if(a){ a.addEventListener("play",function(){ el.classList.add("audio-pulse-active"); }); a.addEventListener("pause",function(){ el.classList.remove("audio-pulse-active"); }); a.addEventListener("ended",function(){ el.classList.remove("audio-pulse-active"); }); } }
      if(fx === "parallax") parallaxEls.push(el);
    });
    if(parallaxEls.length){
      window.addEventListener("scroll", function(){
        var center = window.innerHeight/2;
        parallaxEls.forEach(function(el){ var r=el.getBoundingClientRect(); var dist=(r.top+r.height/2)-center; var shift=Math.max(-24,Math.min(24, dist*-0.04)); el.style.transform="translateY("+shift+"px)"; });
      });
    }
  })();
  `;
