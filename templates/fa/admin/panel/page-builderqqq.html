              <th>عنوان</th><th>وضعیت</th><th>بخش‌ها</th><th class="sortable" id="sortByDate">آخرین ویرایش ${pagesSortDir==="desc"?"↓":"↑"}</th><th>عملیات</th>
            </tr></thead>
            <tbody>
              ${list.map(p => `
                <tr data-page="${p.id}">
                  <td><input type="checkbox" class="rowChk" data-page="${p.id}" ${selectedPageIds.has(p.id)?"checked":""}></td>
                  <td><div class="ttl" data-action="open-builder" data-page="${p.id}">${escapeHtml(p.title)}</div><div class="slug">/${escapeHtml(p.slug)}</div></td>
                  <td><span class="status-badge ${p.status}">${p.status==="published"?"منتشر شده":"پیش‌نویس"}</span></td>
                  <td>${toFa(p.blocks.length)}</td>
                  <td>${formatRelative(p.updatedAt)}</td>
                  <td><div class="row-actions">
                    <button data-action="open-builder" data-page="${p.id}" title="ویرایش محتوا">✏️</button>
                    <button data-action="open-seo" data-page="${p.id}" title="عنوان و سئو">🏷️</button>
                    <button data-action="duplicate-page" data-page="${p.id}" title="کپی">⧉</button>
                    <button class="danger" data-action="delete-page" data-page="${p.id}" title="حذف">🗑</button>
                  </div></td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    } else {
      bodyHtml = `<div class="pages-grid">${list.map(p => `
        <div class="page-card" data-page="${p.id}">
          <div class="page-card-thumb">📄</div>
          <div class="page-card-body">
            <div class="page-card-title-row"><h4>${escapeHtml(p.title)}</h4><span class="status-badge ${p.status}">${p.status==="published"?"منتشر شده":"پیش‌نویس"}</span></div>
            <div class="page-card-slug">/${escapeHtml(p.slug)}</div>
            <div class="page-card-meta">${toFa(p.blocks.length)} بخش · ${formatRelative(p.updatedAt)}</div>
          </div>
          <div class="page-card-actions">
            <button data-action="open-builder" data-page="${p.id}" title="ویرایش محتوا">✏️</button>
            <button data-action="open-seo" data-page="${p.id}" title="عنوان و سئو">🏷️</button>
            <button data-action="duplicate-page" data-page="${p.id}" title="کپی">⧉</button>
            <button data-action="delete-page" data-page="${p.id}" title="حذف">🗑</button>
          </div>
        </div>`).join("")}</div>`;
    }

    cmsBody.innerHTML = tabsHtml + bulkHtml + bodyHtml;

    cmsBody.querySelectorAll(".cms-tabs button").forEach(b => b.addEventListener("click", () => { pagesStatusFilter = b.dataset.filter; renderPagesBody(); }));
    const sortBtn = document.getElementById("sortByDate");
    if(sortBtn) sortBtn.addEventListener("click", () => { pagesSortDir = pagesSortDir === "desc" ? "asc" : "desc"; renderPagesBody(); });
    const selectAll = document.getElementById("selectAllChk");
    if(selectAll) selectAll.addEventListener("change", e => {
      if(e.target.checked) list.forEach(p => selectedPageIds.add(p.id));
      else list.forEach(p => selectedPageIds.delete(p.id));
      renderPagesBody();
    });
    cmsBody.querySelectorAll(".rowChk").forEach(chk => chk.addEventListener("change", e => {
      if(e.target.checked) selectedPageIds.add(e.target.dataset.page); else selectedPageIds.delete(e.target.dataset.page);
      renderPagesBody();
    }));
    const bulkDeleteBtn = document.getElementById("bulkDeleteBtn");
    if(bulkDeleteBtn) bulkDeleteBtn.addEventListener("click", () => {
      if(pages.length - selectedPageIds.size < 1){ alert("حداقل باید یک صفحه باقی بماند."); return; }
      if(confirm(toFa(selectedPageIds.size) + " صفحه حذف شود؟")){
        pages = pages.filter(p => !selectedPageIds.has(p.id));
        selectedPageIds.clear();
        renderPagesBody();
      }
    });

    cmsBody.querySelectorAll("[data-action]").forEach(el => el.addEventListener("click", e => {
      const t = e.currentTarget, pageId = t.dataset.page, action = t.dataset.action;
      if(action === "open-builder") goToBuilder(pageId);
      else if(action === "open-seo") openSeoModal(pageId);
      else if(action === "duplicate-page"){
        const src = getPage(pageId);
        const copy = JSON.parse(JSON.stringify(src));
        copy.id = uid(); copy.title = src.title + " (کپی)"; copy.slug = src.slug + "-copy-" + Math.floor(Math.random()*900+100);
        copy.createdAt = Date.now(); copy.updatedAt = Date.now();
        copy.blocks.forEach(regenIds);
        pages.push(copy); renderPagesBody();
      }
      else if(action === "delete-page"){
        if(pages.length <= 1){ alert("حداقل باید یک صفحه وجود داشته باشد."); return; }
        if(confirm("این صفحه حذف شود؟")){ pages = pages.filter(p=>p.id!==pageId); selectedPageIds.delete(pageId); renderPagesBody(); }
      }
    }));
  }

  function createNewPage(){
    const p = makePage("صفحه جدید " + (pages.length+1));
    pages.push(p);
    goToBuilder(p.id);
  }

  function goToPages(){
    builderView.classList.add("hidden");
    pagesView.classList.remove("hidden");
    currentSection = "dashboard";
    renderMainContent();
  }
  function goToBuilder(pageId){
    currentPageId = pageId;
    pagesView.classList.add("hidden");
    builderView.classList.remove("hidden");
    document.getElementById("pageTitleChipText").textContent = getPage(pageId).title;
    device = "desktop";
    deviceSeg.querySelectorAll("button").forEach(x=>x.classList.toggle("active", x.dataset.device==="desktop"));
    canvasWrapper.className = "canvas-wrapper device-desktop";
    deviceWidthLabel.textContent = widths.desktop;
    closePanel();
    renderCanvas();
  }

  document.getElementById("backToPagesBtn").addEventListener("click", goToPages);
  document.getElementById("pageTitleChip").addEventListener("click", () => openSeoModal(currentPageId));

  /* ================= SEO modal ================= */
  const seoModal = document.getElementById("seoModal");
  const seoTabs = document.getElementById("seoTabs");
  const seoBody = document.getElementById("seoBody");
  let seoDraft = null, seoTargetId = null, seoTab = "title";

  function openSeoModal(pageId){
    seoTargetId = pageId;
    seoDraft = JSON.parse(JSON.stringify(getPage(pageId)));
    delete seoDraft.blocks;
    seoTab = "title";
    seoModal.classList.remove("hidden");
    renderSeoBody();
  }
  function closeSeoModal(){ seoModal.classList.add("hidden"); seoDraft = null; }
  document.getElementById("seoModalClose").addEventListener("click", closeSeoModal);
  document.getElementById("seoCancelBtn").addEventListener("click", closeSeoModal);
  seoModal.addEventListener("click", e => { if(e.target===seoModal) closeSeoModal(); });

  seoTabs.addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if(!b) return;
    seoTab = b.dataset.tab;
    seoTabs.querySelectorAll("button").forEach(x=>x.classList.toggle("active", x===b));
    renderSeoBody();
  });

  function renderSeoBody(){
    if(seoTab === "title"){
      seoBody.innerHTML = `
        <div class="field"><label>عنوان داخلی صفحه (نمایش در لیست)</label><input type="text" id="seo-title" value="${escapeHtml(seoDraft.title)}"></div>
        <div class="field"><label>آدرس صفحه (Slug)</label><input type="text" id="seo-slug" value="${escapeHtml(seoDraft.slug)}" style="direction:ltr;text-align:right;"></div>
        <div class="field"><label>عنوان سئو (Title Tag)</label><input type="text" id="seo-seotitle" value="${escapeHtml(seoDraft.seoTitle)}" placeholder="در صورت خالی بودن از عنوان داخلی استفاده می‌شود"><span class="char-counter" id="seo-title-count">0/60</span></div>
        <label class="checkbox-row"><input type="checkbox" id="seo-status" ${seoDraft.status==="published"?"checked":""}> این صفحه منتشر شده باشد</label>`;
      const upd = () => { document.getElementById("seo-title-count").textContent = document.getElementById("seo-seotitle").value.length + "/60"; };
      document.getElementById("seo-title").addEventListener("input", e => seoDraft.title = e.target.value);
      document.getElementById("seo-slug").addEventListener("input", e => seoDraft.slug = e.target.value.replace(/\s+/g,"-"));
      document.getElementById("seo-seotitle").addEventListener("input", e => { seoDraft.seoTitle = e.target.value; upd(); });
      document.getElementById("seo-status").addEventListener("change", e => seoDraft.status = e.target.checked ? "published" : "draft");
      upd();
    } else if(seoTab === "meta"){
      seoBody.innerHTML = `
        <div class="field"><label>توضیحات متا (Meta Description)</label><textarea id="seo-desc" rows="3">${escapeHtml(seoDraft.metaDescription)}</textarea><span class="char-counter" id="seo-desc-count">0/160</span></div>
        <div class="field"><label>کلمات کلیدی (با کاما جدا کن)</label><input type="text" id="seo-keywords" value="${escapeHtml(seoDraft.metaKeywords)}"></div>
        <div class="field"><label>تصویر Open Graph (URL)</label><input type="text" id="seo-og" value="${escapeHtml(seoDraft.ogImage)}" placeholder="https://..."></div>
        <div class="field"><label>نمایه‌سازی توسط موتور جستجو</label>
          <select id="seo-robots">
            <option value="index" ${seoDraft.robots==="index"?"selected":""}>ایندکس شود (index)</option>
            <option value="noindex" ${seoDraft.robots==="noindex"?"selected":""}>ایندکس نشود (noindex)</option>
          </select>
        </div>`;
      const upd = () => { document.getElementById("seo-desc-count").textContent = document.getElementById("seo-desc").value.length + "/160"; };
      document.getElementById("seo-desc").addEventListener("input", e => { seoDraft.metaDescription = e.target.value; upd(); });
      document.getElementById("seo-keywords").addEventListener("input", e => seoDraft.metaKeywords = e.target.value);
      document.getElementById("seo-og").addEventListener("input", e => seoDraft.ogImage = e.target.value);
      document.getElementById("seo-robots").addEventListener("change", e => seoDraft.robots = e.target.value);
      upd();
    } else if(seoTab === "schema"){
      const types = Object.keys(SCHEMA_TEMPLATES);
      seoBody.innerHTML = `
        <div class="field"><label>نوع Schema</label>
          <select id="seo-schematype">${types.map(t=>`<option value="${t}" ${seoDraft.schemaType===t?"selected":""}>${t}</option>`).join("")}</select>
        </div>
        <button class="btn" id="seo-schema-fill" style="align-self:flex-start;">پر کردن خودکار بر اساس نوع</button>
        <div class="field"><label>کد JSON-LD</label><textarea id="seo-schemajson" rows="10" style="font-family:monospace;direction:ltr;text-align:left;">${escapeHtml(seoDraft.schemaJson)}</textarea></div>
        <div class="json-status" id="seo-json-status"></div>`;
      const statusEl = document.getElementById("seo-json-status");
      const checkJson = () => {
        try{ JSON.parse(document.getElementById("seo-schemajson").value); statusEl.className="json-status ok"; statusEl.textContent="✓ JSON معتبر است"; }
        catch(e){ statusEl.className="json-status bad"; statusEl.textContent="✗ خطا در ساختار JSON"; }
      };
      document.getElementById("seo-schematype").addEventListener("change", e => { seoDraft.schemaType = e.target.value; });
      document.getElementById("seo-schema-fill").addEventListener("click", () => {
        const tmpl = SCHEMA_TEMPLATES[seoDraft.schemaType](seoDraft.seoTitle || seoDraft.title);
        seoDraft.schemaJson = JSON.stringify(tmpl, null, 2);
        document.getElementById("seo-schemajson").value = seoDraft.schemaJson;
        checkJson();
      });
      document.getElementById("seo-schemajson").addEventListener("input", e => { seoDraft.schemaJson = e.target.value; checkJson(); });
      checkJson();
    }
  }

  document.getElementById("seoSaveBtn").addEventListener("click", () => {
    const page = getPage(seoTargetId);
    Object.assign(page, seoDraft);
    if(seoTargetId === currentPageId) document.getElementById("pageTitleChipText").textContent = page.title;
    closeSeoModal();
    if(builderView.classList.contains("hidden")) renderMainContent();
  });
  document.getElementById("seoEditHeaderBtn").addEventListener("click", () => openHfModal("header", "override", seoTargetId));
  document.getElementById("seoEditFooterBtn").addEventListener("click", () => openHfModal("footer", "override", seoTargetId));

  /* ================= Header/Footer editor modal ================= */
  const hfModal = document.getElementById("hfModal");
  const hfModalTitle = document.getElementById("hfModalTitle");
  const hfScopeRow = document.getElementById("hfScopeRow");
  const hfScopeSelect = document.getElementById("hfScopeSelect");
  const hfTplGallery = document.getElementById("hfTplGallery");
  const hfFormBody = document.getElementById("hfFormBody");
  const hfPreviewBox = document.getElementById("hfPreviewBox");
  const hfPreviewDevices = document.getElementById("hfPreviewDevices");

  let hf = { kind:"header", scope:"global", pageId:null, draft:null, useGlobal:true, previewDevice:"desktop" };

  function openHfModal(kind, scope, pageId){
    hf.kind = kind; hf.scope = scope; hf.pageId = pageId; hf.previewDevice = "desktop";
    const globalCfg = siteAppearance[kind];
    if(scope === "override"){
      const page = getPage(pageId);
      const existing = page[kind + "Override"];
      hf.useGlobal = !existing;
      hf.draft = JSON.parse(JSON.stringify(existing || globalCfg));
      hfScopeRow.classList.remove("hidden");
      hfScopeSelect.value = hf.useGlobal ? "global" : "override";
    } else {
      hf.draft = JSON.parse(JSON.stringify(globalCfg));
      hfScopeRow.classList.add("hidden");
    }
    hfModalTitle.textContent = (kind === "header" ? "ویرایش هدر" : "ویرایش فوتر") + (scope === "override" ? " — این صفحه" : " — سراسری سایت");
    hfPreviewDevices.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.dv === "desktop"));
    hfPreviewBox.className = "hf-preview-box device-desktop";
    hfModal.classList.remove("hidden");
    renderHfModal();
  }
  function closeHfModal(){ hfModal.classList.add("hidden"); }
  document.getElementById("hfModalClose").addEventListener("click", closeHfModal);
  document.getElementById("hfCancelBtn").addEventListener("click", closeHfModal);
  hfModal.addEventListener("click", e => { if(e.target === hfModal) closeHfModal(); });

  hfScopeSelect.addEventListener("change", e => {
    hf.useGlobal = e.target.value === "global";
    if(hf.useGlobal) hf.draft = JSON.parse(JSON.stringify(siteAppearance[hf.kind]));
    renderHfModal();
  });
  hfPreviewDevices.addEventListener("click", e => {
    const b = e.target.closest("button[data-dv]"); if(!b) return;
    hf.previewDevice = b.dataset.dv;
    hfPreviewDevices.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
    hfPreviewBox.className = "hf-preview-box device-" + hf.previewDevice;
    renderHfPreview();
  });

  function renderHfPreview(){
    hfPreviewBox.innerHTML = hf.kind === "header" ? renderHeaderHtml(hf.draft) : renderFooterHtml(hf.draft);
    initHeaderFooterBehavior(hfPreviewBox);
  }

  function renderHfModal(){
    const templates = hf.kind === "header" ? HEADER_TEMPLATES : FOOTER_TEMPLATES;
    const disabled = hf.scope === "override" && hf.useGlobal;
    hfTplGallery.innerHTML = templates.map(t => `
      <button type="button" class="tpl-card ${hf.draft.template===t.id?"active":""}" data-tpl="${t.id}" ${disabled?"disabled":""}>
        <span class="tpl-dot"></span>${t.name}
      </button>`).join("");
    hfTplGallery.querySelectorAll(".tpl-card").forEach(b => b.addEventListener("click", () => {
      hf.draft.template = b.dataset.tpl; renderHfModal();
    }));

    if(disabled){
      hfFormBody.innerHTML = `<div style="color:var(--text-muted);font-size:12.5px;padding:20px 6px;">این صفحه از تنظیمات سراسری سایت استفاده می‌کند. برای شخصی‌سازی، از منوی بالا «تنظیمات اختصاصی همین صفحه» را انتخاب کن.</div>`;
    } else if(hf.kind === "header"){
      hfFormBody.innerHTML = buildHeaderFormHTML(hf.draft.content);
      wireHeaderForm(hfFormBody, hf.draft.content, () => { renderHfPreview(); });
    } else {
      hfFormBody.innerHTML = buildFooterFormHTML(hf.draft.content);
      wireFooterForm(hfFormBody, hf.draft.content, () => { renderHfPreview(); });
    }
    renderHfPreview();
  }

  function buildHeaderFormHTML(c){
    const navRows = c.navItems.map((n,i) => `
      <div class="hf-repeat-row">
        <input type="text" data-nav="label" data-i="${i}" value="${escapeHtml(n.label)}" placeholder="عنوان">
        <input type="text" data-nav="link" data-i="${i}" value="${escapeHtml(n.link)}" placeholder="لینک">
        <button type="button" data-nav-del="${i}">✕</button>
      </div>`).join("");
    return `
      <details class="hf-form-group" open><summary>لوگو و برند</summary>
        <div class="field"><label>نوع لوگو</label>
          <select id="hf-logotype"><option value="text" ${c.logoType==="text"?"selected":""}>متنی</option><option value="image" ${c.logoType==="image"?"selected":""}>تصویر</option></select>
        </div>
        <div class="field" id="hf-logotext-wrap" style="${c.logoType==="image"?"display:none":""}"><label>متن لوگو / نام برند</label><input type="text" id="hf-logotext" value="${escapeHtml(c.logoText)}"></div>
        <div class="field" id="hf-logoimg-wrap" style="${c.logoType==="text"?"display:none":""}"><label>آدرس تصویر لوگو</label><input type="text" id="hf-logoimage" value="${escapeHtml(c.logoImage)}" placeholder="https://..."><span class="hf-cap">لوگو همیشه با ارتفاع محدود و متناسب نمایش داده می‌شود؛ هر تصویری امن است.</span></div>
      </details>
      <details class="hf-form-group" open><summary>منو (حداکثر ۶ آیتم)</summary>
        <div id="hf-nav-rows">${navRows}</div>
        <button type="button" class="hf-add-row" id="hf-nav-add" ${c.navItems.length>=6?"disabled":""}>+ افزودن آیتم منو (${toFa(c.navItems.length)}/۶)</button>
      </details>
      <details class="hf-form-group"><summary>دکمه CTA</summary>
        <label class="checkbox-row"><input type="checkbox" id="hf-cta-show" ${c.showCta?"checked":""}> نمایش دکمه</label>
        <div class="field"><label>متن دکمه</label><input type="text" id="hf-cta-text" value="${escapeHtml(c.ctaText)}"></div>
        <div class="field"><label>لینک دکمه</label><input type="text" id="hf-cta-link" value="${escapeHtml(c.ctaLink)}"></div>
      </details>
      <details class="hf-form-group"><summary>نوار اطلاعات بالا</summary>
        <label class="checkbox-row"><input type="checkbox" id="hf-tb-show" ${c.showTopBar?"checked":""}> نمایش نوار بالا</label>
        <div class="field"><label>تلفن</label><input type="text" id="hf-tb-phone" value="${escapeHtml(c.topBarPhone)}"></div>
        <div class="field"><label>ایمیل</label><input type="text" id="hf-tb-email" value="${escapeHtml(c.topBarEmail)}"></div>
        <div class="field"><label>متن سمت دیگر</label><input type="text" id="hf-tb-text" value="${escapeHtml(c.topBarText)}"></div>
      </details>
      <details class="hf-form-group"><summary>جستجو</summary>
        <label class="checkbox-row"><input type="checkbox" id="hf-search-show" ${c.showSearch?"checked":""}> نمایش کادر جستجو</label>
        <div class="field"><label>متن جایگزین (Placeholder)</label><input type="text" id="hf-search-ph" value="${escapeHtml(c.searchPlaceholder)}"></div>
      </details>`;
  }

  function wireHeaderForm(container, c, onChange){
    container.querySelector("#hf-logotype").addEventListener("change", e => {
      c.logoType = e.target.value;
      container.querySelector("#hf-logotext-wrap").style.display = c.logoType==="image" ? "none" : "";
      container.querySelector("#hf-logoimg-wrap").style.display = c.logoType==="text" ? "none" : "";
      onChange();
    });
    container.querySelector("#hf-logotext").addEventListener("input", e => { c.logoText = e.target.value; onChange(); });
    container.querySelector("#hf-logoimage").addEventListener("input", e => { c.logoImage = e.target.value; onChange(); });
    container.querySelectorAll('[data-nav="label"]').forEach(inp => inp.addEventListener("input", e => { c.navItems[+e.target.dataset.i].label = e.target.value; onChange(); }));
    container.querySelectorAll('[data-nav="link"]').forEach(inp => inp.addEventListener("input", e => { c.navItems[+e.target.dataset.i].link = e.target.value; onChange(); }));
    container.querySelectorAll('[data-nav-del]').forEach(btn => btn.addEventListener("click", e => { c.navItems.splice(+e.target.dataset.navDel, 1); renderHfModal(); }));
    const addBtn = container.querySelector("#hf-nav-add");
    if(addBtn) addBtn.addEventListener("click", () => { if(c.navItems.length<6){ c.navItems.push({label:"آیتم جدید",link:"#"}); renderHfModal(); } });
    container.querySelector("#hf-cta-show").addEventListener("change", e => { c.showCta = e.target.checked; onChange(); });
    container.querySelector("#hf-cta-text").addEventListener("input", e => { c.ctaText = e.target.value; onChange(); });
    container.querySelector("#hf-cta-link").addEventListener("input", e => { c.ctaLink = e.target.value; onChange(); });
    container.querySelector("#hf-tb-show").addEventListener("change", e => { c.showTopBar = e.target.checked; onChange(); });
    container.querySelector("#hf-tb-phone").addEventListener("input", e => { c.topBarPhone = e.target.value; onChange(); });
    container.querySelector("#hf-tb-email").addEventListener("input", e => { c.topBarEmail = e.target.value; onChange(); });
    container.querySelector("#hf-tb-text").addEventListener("input", e => { c.topBarText = e.target.value; onChange(); });
    container.querySelector("#hf-search-show").addEventListener("change", e => { c.showSearch = e.target.checked; onChange(); });
    container.querySelector("#hf-search-ph").addEventListener("input", e => { c.searchPlaceholder = e.target.value; onChange(); });
  }

  function buildFooterFormHTML(c){
    const colsHtml = c.columns.map((col,ci) => `
      <div class="hf-form-group" style="background:var(--chrome-bg-alt);">
        <div class="field"><label>عنوان ستون ${toFa(ci+1)}</label><input type="text" data-col-title="${ci}" value="${escapeHtml(col.title)}"></div>
        <div data-col-links="${ci}">${col.links.map((l,li)=>`
          <div class="hf-repeat-row">
            <input type="text" data-link="label" data-ci="${ci}" data-li="${li}" value="${escapeHtml(l.label)}" placeholder="عنوان لینک">
            <input type="text" data-link="url" data-ci="${ci}" data-li="${li}" value="${escapeHtml(l.link)}" placeholder="آدرس">
            <button type="button" data-link-del="${ci}:${li}">✕</button>
          </div>`).join("")}</div>
        <button type="button" class="hf-add-row" data-col-add="${ci}" ${col.links.length>=5?"disabled":""}>+ لینک جدید (${toFa(col.links.length)}/۵)</button>
      </div>`).join("");
    const socialRows = c.socialLinks.map((s,i) => `
      <div class="hf-repeat-row">
        <select data-soc="platform" data-i="${i}" style="flex:1;">${SOCIAL_PLATFORMS.map(p=>`<option value="${p.v}" ${s.platform===p.v?"selected":""}>${p.t}</option>`).join("")}</select>
        <input type="text" data-soc="url" data-i="${i}" value="${escapeHtml(s.url)}" placeholder="لینک">
        <button type="button" data-soc-del="${i}">✕</button>
      </div>`).join("");
    return `
      <details class="hf-form-group" open><summary>لوگو و توضیح</summary>
        <div class="field"><label>نوع لوگو</label>
          <select id="hf-flogotype"><option value="text" ${c.logoType==="text"?"selected":""}>متنی</option><option value="image" ${c.logoType==="image"?"selected":""}>تصویر</option></select>
        </div>
        <div class="field" id="hf-flogotext-wrap" style="${c.logoType==="image"?"display:none":""}"><label>متن لوگو</label><input type="text" id="hf-flogotext" value="${escapeHtml(c.logoText)}"></div>
        <div class="field" id="hf-flogoimg-wrap" style="${c.logoType==="text"?"display:none":""}"><label>آدرس تصویر لوگو</label><input type="text" id="hf-flogoimage" value="${escapeHtml(c.logoImage)}"></div>
        <div class="field"><label>توضیح کوتاه (Tagline)</label><textarea id="hf-tagline" rows="2">${escapeHtml(c.tagline)}</textarea></div>
      </details>
      <details class="hf-form-group" open><summary>ستون‌های لینک (حداکثر ۳ ستون)</summary>${colsHtml}</details>
      <details class="hf-form-group"><summary>خبرنامه</summary>
        <label class="checkbox-row"><input type="checkbox" id="hf-nl-show" ${c.showNewsletter?"checked":""}> نمایش بخش خبرنامه</label>
        <div class="field"><label>عنوان</label><input type="text" id="hf-nl-head" value="${escapeHtml(c.newsletterHeading)}"></div>
        <div class="field"><label>متن جایگزین ایمیل</label><input type="text" id="hf-nl-ph" value="${escapeHtml(c.newsletterPlaceholder)}"></div>
      </details>
      <details class="hf-form-group"><summary>اطلاعات تماس</summary>
        <label class="checkbox-row"><input type="checkbox" id="hf-ct-show" ${c.showContact?"checked":""}> نمایش اطلاعات تماس</label>
        <div class="field"><label>آدرس</label><input type="text" id="hf-ct-addr" value="${escapeHtml(c.contactAddress)}"></div>
        <div class="field"><label>تلفن</label><input type="text" id="hf-ct-phone" value="${escapeHtml(c.contactPhone)}"></div>
        <div class="field"><label>ایمیل</label><input type="text" id="hf-ct-email" value="${escapeHtml(c.contactEmail)}"></div>
      </details>
      <details class="hf-form-group"><summary>شبکه‌های اجتماعی (حداکثر ۶)</summary>
        <div id="hf-soc-rows">${socialRows}</div>
        <button type="button" class="hf-add-row" id="hf-soc-add" ${c.socialLinks.length>=6?"disabled":""}>+ افزودن شبکه اجتماعی (${toFa(c.socialLinks.length)}/۶)</button>
      </details>
      <details class="hf-form-group"><summary>کپی‌رایت</summary>
        <div class="field"><label>متن کپی‌رایت</label><input type="text" id="hf-copyright" value="${escapeHtml(c.copyrightText)}"></div>
      </details>`;
  }

  function wireFooterForm(container, c, onChange){
    container.querySelector("#hf-flogotype").addEventListener("change", e => {
      c.logoType = e.target.value;
      container.querySelector("#hf-flogotext-wrap").style.display = c.logoType==="image" ? "none" : "";
      container.querySelector("#hf-flogoimg-wrap").style.display = c.logoType==="text" ? "none" : "";
      onChange();
    });
    container.querySelector("#hf-flogotext").addEventListener("input", e => { c.logoText = e.target.value; onChange(); });
    container.querySelector("#hf-flogoimage").addEventListener("input", e => { c.logoImage = e.target.value; onChange(); });
    container.querySelector("#hf-tagline").addEventListener("input", e => { c.tagline = e.target.value; onChange(); });

    container.querySelectorAll('[data-col-title]').forEach(inp => inp.addEventListener("input", e => { c.columns[+e.target.dataset.colTitle].title = e.target.value; onChange(); }));
    container.querySelectorAll('[data-link="label"]').forEach(inp => inp.addEventListener("input", e => { c.columns[+e.target.dataset.ci].links[+e.target.dataset.li].label = e.target.value; onChange(); }));
    container.querySelectorAll('[data-link="url"]').forEach(inp => inp.addEventListener("input", e => { c.columns[+e.target.dataset.ci].links[+e.target.dataset.li].link = e.target.value; onChange(); }));
    container.querySelectorAll('[data-link-del]').forEach(btn => btn.addEventListener("click", e => {
      const [ci,li] = e.target.dataset.linkDel.split(":").map(Number);
      c.columns[ci].links.splice(li,1); renderHfModal();
    }));
    container.querySelectorAll('[data-col-add]').forEach(btn => btn.addEventListener("click", e => {
      const ci = +e.target.dataset.colAdd;
      if(c.columns[ci].links.length<5){ c.columns[ci].links.push({label:"لینک جدید",link:"#"}); renderHfModal(); }
    }));

    container.querySelector("#hf-nl-show").addEventListener("change", e => { c.showNewsletter = e.target.checked; onChange(); });
    container.querySelector("#hf-nl-head").addEventListener("input", e => { c.newsletterHeading = e.target.value; onChange(); });
    container.querySelector("#hf-nl-ph").addEventListener("input", e => { c.newsletterPlaceholder = e.target.value; onChange(); });
    container.querySelector("#hf-ct-show").addEventListener("change", e => { c.showContact = e.target.checked; onChange(); });
    container.querySelector("#hf-ct-addr").addEventListener("input", e => { c.contactAddress = e.target.value; onChange(); });
    container.querySelector("#hf-ct-phone").addEventListener("input", e => { c.contactPhone = e.target.value; onChange(); });
    container.querySelector("#hf-ct-email").addEventListener("input", e => { c.contactEmail = e.target.value; onChange(); });

    container.querySelectorAll('[data-soc="platform"]').forEach(sel => sel.addEventListener("change", e => { c.socialLinks[+e.target.dataset.i].platform = e.target.value; onChange(); }));
    container.querySelectorAll('[data-soc="url"]').forEach(inp => inp.addEventListener("input", e => { c.socialLinks[+e.target.dataset.i].url = e.target.value; onChange(); }));
    container.querySelectorAll('[data-soc-del]').forEach(btn => btn.addEventListener("click", e => { c.socialLinks.splice(+e.target.dataset.socDel,1); renderHfModal(); }));
    const socAdd = container.querySelector("#hf-soc-add");
    if(socAdd) socAdd.addEventListener("click", () => { if(c.socialLinks.length<6){ c.socialLinks.push({platform:"instagram",url:"#"}); renderHfModal(); } });

    container.querySelector("#hf-copyright").addEventListener("input", e => { c.copyrightText = e.target.value; onChange(); });
  }

  document.getElementById("hfSaveBtn").addEventListener("click", () => {
    if(hf.scope === "global"){
      siteAppearance[hf.kind] = { template: hf.draft.template, content: hf.draft.content };
      if(!builderView.classList.contains("hidden")) renderCanvas();
      if(!pagesView.classList.contains("hidden")) renderMainContent();
    } else {
      const page = getPage(hf.pageId);
      if(hf.useGlobal) page[hf.kind + "Override"] = null;
      else page[hf.kind + "Override"] = { template: hf.draft.template, content: hf.draft.content };
      touchPage(hf.pageId);
      if(currentPageId === hf.pageId && !builderView.classList.contains("hidden")) renderCanvas();
    }
    closeHfModal();
  });

  /* ================= init ================= */
  try{ document.execCommand("defaultParagraphSeparator", false, "p"); }catch(e){}
  applySiteColors();
  renderMainContent();
})();
</script>
</body>
</html>
