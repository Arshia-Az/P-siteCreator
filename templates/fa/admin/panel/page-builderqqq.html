<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحه‌ساز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chrome-bg:#161a22;
    --chrome-bg-alt:#1f2430;
    --chrome-border:#2b3140;
    --text-light:#e8eaf0;
    --text-muted:#8b93a5;
    --accent:#f2a63a;
    --accent-dim:#c98526;
    --danger:#e2604f;
    --ok:#3fbf7c;
    --canvas-bg:#eef0f3;
    --page-bg:#ffffff;
    --site-accent:#f2a63a;
    --site-accent-contrast:#1b1305;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Vazirmatn', Tahoma, sans-serif;
    background:var(--chrome-bg);
    color:var(--text-light);
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none !important;}

  /* ================= shared topbar ================= */
  .topbar{
    height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;
    background:var(--chrome-bg-alt);border-bottom:1px solid var(--chrome-border);
    padding:0 18px;gap:16px;
  }
  .brand{font-weight:700;font-size:16px;letter-spacing:.2px;color:var(--text-light);white-space:nowrap;}
  .brand span{color:var(--accent);}
  .icon-btn{
    width:28px;height:28px;border-radius:7px;border:1px solid var(--chrome-border);background:transparent;color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{color:var(--text-light);border-color:#414a5c;}
  .btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--chrome-border);background:var(--chrome-bg);color:var(--text-light);}
  .btn.primary{background:var(--accent);color:#1b1305;border-color:var(--accent);}
  .btn:hover{filter:brightness(1.12);}
  .publish-btn{
    background:var(--accent);color:#1b1305;border:none;padding:9px 20px;border-radius:9px;font-weight:700;font-size:13.5px;
    display:flex;align-items:center;gap:8px;transition:.15s;
  }
  .publish-btn:hover{background:#ffb659;}

  /* ================= PAGES VIEW (CMS Dashboard) ================= */
  #pagesView{display:flex;height:100vh;overflow:hidden;}
  #pagesView[data-theme="light"]{
    --cms-sidebar-bg:#12151c; --cms-sidebar-text:#cfd3dc; --cms-sidebar-text-dim:#838a9c; --cms-sidebar-border:#232733;
    --cms-sidebar-active-bg:#f2a63a1f; --cms-sidebar-active-text:#f2a63a;
    --cms-content-bg:#f2f3f6; --cms-card-bg:#ffffff; --cms-border:#e5e7ec; --cms-border-soft:#eef0f3;
    --cms-text:#1c1f26; --cms-text-muted:#6b7180; --cms-text-faint:#9aa0ab; --cms-row-hover:#f7f8fa; --cms-input-bg:#ffffff;
  }
  #pagesView[data-theme="dark"]{
    --cms-sidebar-bg:#0d0f14; --cms-sidebar-text:#c7cbd6; --cms-sidebar-text-dim:#6d7380; --cms-sidebar-border:#1c2029;
    --cms-sidebar-active-bg:#f2a63a26; --cms-sidebar-active-text:#f2a63a;
    --cms-content-bg:#15181f; --cms-card-bg:#1c2029; --cms-border:#282d38; --cms-border-soft:#232833;
    --cms-text:#e7e9ee; --cms-text-muted:#9aa1b0; --cms-text-faint:#6d7484; --cms-row-hover:#20242e; --cms-input-bg:#181c24;
  }

  .cms-sidebar{width:236px;flex:none;background:var(--cms-sidebar-bg);border-left:1px solid var(--cms-sidebar-border);display:flex;flex-direction:column;height:100vh;}
  .cms-brand{display:flex;align-items:center;gap:8px;padding:20px 18px 16px;}
  .cms-brand .logo-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;}
  .cms-brand-text{font-weight:700;font-size:15px;color:#fff;}
  .cms-brand-text span{color:var(--accent);}
  .cms-brand-tag{font-size:9.5px;color:var(--cms-sidebar-text-dim);border:1px solid var(--cms-sidebar-border);border-radius:5px;padding:1px 6px;margin-right:auto;}
  .cms-nav{flex:1;overflow-y:auto;padding:4px 12px;}
  .cms-nav-group{margin-bottom:14px;}
  .cms-nav-label{font-size:10.5px;color:var(--cms-sidebar-text-dim);padding:6px 10px 4px;letter-spacing:.3px;}
  .cms-nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:none;background:transparent;color:var(--cms-sidebar-text);font-size:13px;text-align:right;font-family:inherit;}
  .cms-nav-item svg{width:17px;height:17px;flex:none;opacity:.8;}
  .cms-nav-item:hover{background:#ffffff14;color:#fff;}
  .cms-nav-item.active{background:var(--cms-sidebar-active-bg);color:var(--cms-sidebar-active-text);font-weight:600;}
  .cms-nav-item.active svg{opacity:1;}
  .cms-sidebar-footer{border-top:1px solid var(--cms-sidebar-border);padding:12px;display:flex;align-items:center;gap:10px;}
  .cms-theme-toggle{width:34px;height:34px;border-radius:9px;border:1px solid var(--cms-sidebar-border);background:transparent;color:var(--cms-sidebar-text);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
  .cms-theme-toggle:hover{border-color:var(--accent);color:var(--accent);}
  .cms-user-chip{display:flex;align-items:center;gap:8px;overflow:hidden;}
  .cms-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#1b1305;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;}
  .cms-user-name{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;}
  .cms-user-role{font-size:10.5px;color:var(--cms-sidebar-text-dim);white-space:nowrap;}

  .cms-main{flex:1;display:flex;flex-direction:column;background:var(--cms-content-bg);overflow:hidden;}
  .cms-header{flex:none;padding:18px 26px;border-bottom:1px solid var(--cms-border);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .cms-header h2{margin:0;font-size:18px;color:var(--cms-text);}
  .cms-header .cms-subtitle{font-size:12.5px;color:var(--cms-text-muted);margin-top:2px;}
  .cms-header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .cms-search input{width:220px;background:var(--cms-input-bg);border:1px solid var(--cms-border);color:var(--cms-text);border-radius:9px;padding:8px 12px;font-size:13px;font-family:inherit;}
  .cms-viewtoggle{display:flex;border:1px solid var(--cms-border);border-radius:9px;overflow:hidden;}
  .cms-viewtoggle button{background:var(--cms-input-bg);border:none;color:var(--cms-text-muted);padding:8px 10px;display:flex;align-items:center;}
  .cms-viewtoggle button.active{background:var(--accent);color:#1b1305;}
  .cms-body{flex:1;overflow:auto;padding:22px 26px 60px;}

  .cms-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:26px;}
  .cms-stat-card{background:var(--cms-card-bg);border:1px solid var(--cms-border);border-radius:12px;padding:16px 18px;}
  .cms-stat-card .icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:#f2a63a22;color:var(--accent);}
  .cms-stat-card .num{font-size:24px;font-weight:700;color:var(--cms-text);}
  .cms-stat-card .lbl{font-size:12px;color:var(--cms-text-muted);margin-top:4px;}
  .cms-section-title{font-size:14px;font-weight:700;color:var(--cms-text);margin:0 0 12px;}
  .cms-recent-list{background:var(--cms-card-bg);border:1px solid var(--cms-border);border-radius:12px;overflow:hidden;}
  .cms-recent-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--cms-border-soft);cursor:pointer;}
  .cms-recent-row:last-child{border-bottom:none;}
  .cms-recent-row:hover{background:var(--cms-row-hover);}
  .cms-recent-row .t{font-size:13px;color:var(--cms-text);font-weight:600;}
  .cms-recent-row .s{font-size:11.5px;color:var(--cms-text-muted);margin-top:2px;}
  .cms-recent-empty{padding:30px 16px;text-align:center;color:var(--cms-text-muted);font-size:12.5px;}

  .cms-tabs{display:flex;gap:14px;margin-bottom:16px;border-bottom:1px solid var(--cms-border);}
  .cms-tabs button{background:transparent;border:none;color:var(--cms-text-muted);font-size:13px;padding:8px 2px;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .cms-tabs button.active{color:var(--cms-text);border-bottom-color:var(--accent);font-weight:600;}

  .cms-bulkbar{display:none;align-items:center;gap:12px;background:var(--cms-card-bg);border:1px solid var(--cms-border);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--cms-text);}
  .cms-bulkbar.show{display:flex;}
  .cms-bulkbar .danger-link{margin-right:auto;background:transparent;border:none;color:var(--danger);font-size:12.5px;font-weight:600;}

  .cms-table-wrap{background:var(--cms-card-bg);border:1px solid var(--cms-border);border-radius:12px;overflow:hidden;}
  .cms-table{width:100%;border-collapse:collapse;font-size:13px;}
  .cms-table th{text-align:right;font-size:11px;color:var(--cms-text-muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--cms-border);background:var(--cms-row-hover);white-space:nowrap;}
  .cms-table th.sortable{cursor:pointer;user-select:none;}
  .cms-table td{padding:12px 14px;border-bottom:1px solid var(--cms-border-soft);color:var(--cms-text);vertical-align:middle;}
  .cms-table tr:last-child td{border-bottom:none;}
  .cms-table tbody tr:hover td{background:var(--cms-row-hover);}
  .cms-table .ttl{font-weight:600;cursor:pointer;}
  .cms-table .slug{font-size:11.5px;color:var(--cms-text-faint);direction:ltr;text-align:right;margin-top:2px;}
  .cms-table .row-actions{display:flex;gap:6px;}
  .cms-table .row-actions button{width:28px;height:28px;border-radius:7px;border:1px solid var(--cms-border);background:transparent;color:var(--cms-text-muted);display:flex;align-items:center;justify-content:center;}
  .cms-table .row-actions button:hover{border-color:var(--accent);color:var(--accent);}
  .cms-table .row-actions button.danger:hover{border-color:var(--danger);color:var(--danger);}
  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;}

  .pages-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
  .page-card{background:var(--cms-card-bg);border:1px solid var(--cms-border);border-radius:12px;overflow:hidden;box-shadow:0 1px 0 #0001;display:flex;flex-direction:column;color:var(--cms-text);}
  .page-card-thumb{height:100px;background:linear-gradient(135deg,#f2a63a26,var(--cms-row-hover));display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:28px;}
  .page-card-body{padding:14px 16px 6px;flex:1;}
  .page-card-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .page-card-title-row h4{margin:0;font-size:14.5px;font-weight:700;}
  .status-badge{font-size:10.5px;padding:3px 8px;border-radius:20px;font-weight:700;white-space:nowrap;}
  .status-badge.draft{background:#f1e6cf;color:#8a5a00;}
  .status-badge.published{background:#dcf3e6;color:#1c8a52;}
  .page-card-slug{font-size:12px;color:var(--cms-text-faint);margin-top:4px;direction:ltr;text-align:right;}
  .page-card-meta{font-size:11.5px;color:var(--cms-text-faint);margin-top:8px;}
  .page-card-actions{display:flex;border-top:1px solid var(--cms-border-soft);margin-top:12px;}
  .page-card-actions button{flex:1;border:none;background:transparent;padding:10px 0;font-size:14px;color:var(--cms-text-muted);border-left:1px solid var(--cms-border-soft);}
  .page-card-actions button:first-child{border-left:none;}
  .page-card-actions button:hover{background:var(--cms-row-hover);color:var(--cms-text);}
  .pages-empty{grid-column:1/-1;text-align:center;color:var(--cms-text-muted);padding:80px 0;font-size:14px;}

  .cms-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:90px 20px;color:var(--cms-text-muted);background:var(--cms-card-bg);border:1px dashed var(--cms-border);border-radius:14px;text-align:center;}
  .cms-placeholder .pi{width:52px;height:52px;border-radius:14px;background:#f2a63a22;color:var(--accent);display:flex;align-items:center;justify-content:center;}
  .cms-placeholder .pi svg{width:26px;height:26px;}
  .cms-placeholder h3{margin:4px 0 0;font-size:15px;color:var(--cms-text);}
  .cms-placeholder p{margin:0;font-size:12.5px;max-width:360px;}
  .cms-placeholder .soon-badge{font-size:10.5px;background:#f2a63a22;color:var(--accent);padding:3px 10px;border-radius:20px;font-weight:700;}

  /* ================= BUILDER VIEW ================= */
  #builderView{display:flex;flex-direction:column;height:100vh;}
  .page-title-chip{
    display:flex;align-items:center;gap:8px;background:var(--chrome-bg);border:1px solid var(--chrome-border);
    padding:6px 12px;border-radius:9px;cursor:pointer;
  }
  .page-title-chip:hover{border-color:#414a5c;}
  .page-title-chip .pt{font-size:13px;font-weight:600;}
  .page-title-chip .ps{font-size:11px;color:var(--text-muted);}
  .device-switch{display:flex;align-items:center;gap:10px;}
  .device-switch .seg{display:flex;background:var(--chrome-bg);border:1px solid var(--chrome-border);border-radius:10px;padding:3px;gap:2px;}
  .device-switch button{
    border:none;background:transparent;color:var(--text-muted);padding:7px 14px;border-radius:8px;font-size:13px;
    display:flex;align-items:center;gap:6px;transition:.15s;
  }
  .device-switch button.active{background:var(--accent);color:#1b1305;font-weight:600;}
  .device-switch button:not(.active):hover{color:var(--text-light);}
  .device-width-label{font-size:12px;color:var(--text-muted);min-width:52px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}

  .workspace{flex:1;display:flex;overflow:hidden;position:relative;}
  .canvas-scroll{
    flex:1;overflow:auto;background:
      radial-gradient(circle at 1px 1px, #ffffff12 1px, transparent 0) 0 0/22px 22px, var(--canvas-bg);
    display:flex;justify-content:center;padding:0;
  }
  .canvas-wrapper{width:100%;max-width:1320px;transition:max-width .25s ease;}
  .canvas-wrapper.device-tablet{max-width:768px;}
  .canvas-wrapper.device-mobile{max-width:390px;}
  .canvas{
    background:var(--page-bg);min-height:100%;
    overflow:hidden;color:#1c1f26;
  }

  .empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:110px 20px;color:#8a8f99;
  }
  .empty-state p{margin:0;font-size:14px;}
  .big-add{
    width:64px;height:64px;border-radius:50%;border:2px dashed #c7cbd3;background:#fafafb;color:#9aa0ab;
    font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .big-add:hover{border-color:var(--accent);color:var(--accent-dim);background:#fff8ec;}

  .block{position:relative;border-top:1px solid transparent;}
  .block:hover{outline:1.5px dashed #cdb37a99;outline-offset:-1.5px;}
  .block-toolbar{position:absolute;top:6px;left:10px;display:flex;gap:4px;z-index:5;opacity:0;transition:.15s;}
  .block:hover .block-toolbar{opacity:1;}
  .block-toolbar button{
    width:26px;height:26px;border-radius:6px;border:1px solid #d8dbe1;background:#ffffffee;color:#555;
    display:flex;align-items:center;justify-content:center;font-size:13px;
  }
  .block-toolbar button:hover{background:#fff;color:#111;}
  .block-toolbar button.on{background:var(--accent);color:#1b1305;border-color:var(--accent);}
  .block-toolbar button.danger:hover{color:var(--danger);border-color:var(--danger);}
  .block-inner{padding:26px 0;}
  .block.boxed .block-inner{max-width:1080px;margin:0 auto;padding:26px 28px;}
  .block.full .block-inner{padding:26px 0;}

  .row{display:flex;gap:18px;padding:0 28px;align-items:stretch;}
  .block.full .row{padding:0 20px;}
  .grid-row{display:grid;gap:18px;padding:0 28px;}
  .block.full .grid-row{padding:0 20px;}

  .device-mobile .grid-row{grid-template-columns:1fr !important;}
  .device-tablet .grid-row{grid-template-columns:repeat(2,1fr) !important;}

  .cell{position:relative;min-height:96px;border:1px dashed #dfe2e8;border-radius:6px;padding:14px;transition:.15s;}
  .cell:hover{border-color:#c9ccd4;background:#fafafc;}
  .cell.has-content{border-style:solid;border-color:#eceef1;}
  .cell-empty-add{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .cell-empty-add button{
    width:34px;height:34px;border-radius:50%;border:1.5px dashed #c7cbd3;background:#fff;color:#9aa0ab;font-size:18px;
  }
  .cell-empty-add button:hover{border-color:var(--accent);color:var(--accent-dim);}
  .cell-toolbar{position:absolute;top:6px;left:6px;display:flex;gap:4px;opacity:0;transition:.15s;z-index:4;}
  .cell:hover .cell-toolbar{opacity:1;}
  .cell-toolbar button{
    width:22px;height:22px;border-radius:5px;border:1px solid #d8dbe1;background:#fff;color:#666;display:flex;align-items:center;justify-content:center;font-size:11.5px;
  }
  .cell-toolbar button:hover{color:#111;}
  .cell-toolbar button.on{background:#fff3de;border-color:var(--accent);color:var(--accent-dim);}
  .cell-toolbar button.danger:hover{color:var(--danger);border-color:var(--danger);}
  .cell-move-handle{cursor:grab;}
  .cell-move-handle:active{cursor:grabbing;}
  .cell.cell-drop-target{outline:2px dashed var(--accent);outline-offset:-2px;background:#fff8ec;}
  .widget-choice[draggable=true]{cursor:grab;}
  .widget-choice[draggable=true]:active{cursor:grabbing;}

  .add-after{display:flex;justify-content:center;padding:14px 0;}
  .add-after button{
    width:38px;height:38px;border-radius:50%;border:1.5px dashed #b9bec8;background:#fbfbfc;color:#8a8f99;font-size:19px;
    display:flex;align-items:center;justify-content:center;
  }
  .add-after button:hover{border-color:var(--accent);color:var(--accent-dim);background:#fff8ec;}

  .text-widget{display:flex;flex-direction:column;gap:6px;}
  .tag-select{align-self:flex-start;font-size:11px;border:1px solid #e2e4e9;background:#f6f7f9;color:#666;border-radius:5px;padding:2px 6px;}
  .text-widget [contenteditable]{outline:none;line-height:1.6;}
  .text-widget [contenteditable]:focus{background:#fff8ec;box-shadow:0 0 0 2px #f2a63a55;border-radius:3px;}
  .text-block-editable h1,.text-block-editable h2,.text-block-editable h3,.text-block-editable h4,.text-block-editable h5,.text-block-editable h6{margin:0 0 8px;}
  .text-block-editable h1:last-child,.text-block-editable h2:last-child,.text-block-editable h3:last-child,.text-block-editable h4:last-child,.text-block-editable h5:last-child,.text-block-editable h6:last-child{margin-bottom:0;}
  .text-block-editable p{margin:0 0 8px;font-size:14.5px;color:#3a3f47;}
  .text-block-editable p:last-child{margin-bottom:0;}

  .image-widget{display:flex;flex-direction:column;gap:8px;}
  .image-widget img{display:block;border-radius:4px;max-width:100%;}
  .image-widget .cap [contenteditable]{font-size:13px;color:#666;outline:none;}
  .image-warning{
    font-size:11.5px;background:#fff4e5;color:#8a5a00;border:1px solid #f3d9a4;border-radius:6px;padding:6px 8px;display:flex;gap:6px;align-items:flex-start;
  }
  .image-placeholder{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9aa0ab;font-size:12.5px;
    background:#f5f6f8;border-radius:5px;padding:26px 10px;
  }
  video, audio{display:block;width:100%;}
  .media-placeholder{
    display:flex;align-items:center;justify-content:center;color:#9aa0ab;font-size:12.5px;background:#f5f6f8;border-radius:5px;padding:26px 10px;
  }
  .btn-widget{display:inline-flex;}
  .btn-widget a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;background:#1c1f26;color:#fff;}
  .icon-widget{display:flex;align-items:center;justify-content:center;font-size:26px;color:#1c1f26;}
  .icon-widget a{color:inherit;text-decoration:none;display:flex;}
  .divider-widget{width:100%;}
  .divider-widget hr{border:none;margin:0;}
  .html-widget{font-size:13px;color:#444;}
  .html-widget-placeholder{
    display:flex;align-items:center;justify-content:center;color:#9aa0ab;font-size:12px;background:#f5f6f8;border-radius:5px;padding:20px 10px;border:1px dashed #d8dbe1;
  }

  /* ============ EFFECTS ============ */
  .efx-el[data-fx]{transition:opacity .7s ease, transform .7s ease, filter .5s ease, box-shadow .35s ease;}
  .efx-el[data-fx="fadeIn"]{opacity:0;}
  .efx-el[data-fx="fadeInUp"]{opacity:0;transform:translateY(34px);}
  .efx-el[data-fx="fadeInDown"]{opacity:0;transform:translateY(-34px);}
  .efx-el[data-fx="fadeInLeft"]{opacity:0;transform:translateX(-44px);}
  .efx-el[data-fx="fadeInRight"]{opacity:0;transform:translateX(44px);}
  .efx-el[data-fx="zoomIn"]{opacity:0;transform:scale(.82);}
  .efx-el[data-fx="zoomOut"]{opacity:0;transform:scale(1.18);}
  .efx-el[data-fx="slideInUp"]{transform:translateY(80px);}
  .efx-el[data-fx="flipInX"]{opacity:0;transform:perspective(700px) rotateX(65deg);}
  .efx-el[data-fx="rotateIn"]{opacity:0;transform:rotate(-10deg) scale(.92);}
  .efx-el[data-fx="bounceIn"]{opacity:0;transform:scale(.5);transition-timing-function:cubic-bezier(.34,1.56,.64,1);}
  .efx-el.efx-in{opacity:1 !important;transform:none !important;}

  .efx-el[data-fx="hoverLift"]:hover,.efx-el[data-fx="hoverLift"].fx-preview{transform:translateY(-8px);box-shadow:0 20px 40px -18px #00000055;}
  .efx-el[data-fx="hoverScale"]:hover,.efx-el[data-fx="hoverScale"].fx-preview{transform:scale(1.015);}

  @keyframes efxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .efx-el[data-fx="float"]{animation:efxFloat 3.4s ease-in-out infinite;}
  @keyframes efxPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  .efx-el[data-fx="pulse"]{animation:efxPulse 2.2s ease-in-out infinite;}
  .efx-el[data-fx="sticky"]{position:sticky;top:0;z-index:30;}
  .efx-el[data-fx="parallax"]{will-change:transform;}

  .efx-el[data-fx="hoverZoom"]{overflow:hidden;border-radius:4px;}
  .efx-el[data-fx="hoverZoom"] img{transition:transform .5s ease;}
  .efx-el[data-fx="hoverZoom"]:hover img,.efx-el[data-fx="hoverZoom"].fx-preview img{transform:scale(1.1);}
  .efx-el[data-fx="hoverGrayscale"] img{filter:grayscale(1);transition:filter .5s ease;}
  .efx-el[data-fx="hoverGrayscale"]:hover img,.efx-el[data-fx="hoverGrayscale"].fx-preview img{filter:grayscale(0);}
  .efx-el[data-fx="kenBurns"]{overflow:hidden;border-radius:4px;}
  @keyframes efxKen{from{transform:scale(1)}to{transform:scale(1.15)}}
  .efx-el[data-fx="kenBurns"] img{animation:efxKen 10s ease-in-out infinite alternate;}
  .efx-el[data-fx="tiltOnHover"] img{transition:transform .1s ease;}
  .efx-el[data-fx="overlayReveal"]{position:relative;overflow:hidden;border-radius:4px;}
  .efx-el[data-fx="overlayReveal"]::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000000aa,transparent 55%);opacity:0;transition:opacity .4s ease;}
  .efx-el[data-fx="overlayReveal"]:hover::after,.efx-el[data-fx="overlayReveal"].fx-preview::after{opacity:1;}
  .efx-el[data-fx="highlightSweep"]{background-image:linear-gradient(#fce8b8,#fce8b8);background-repeat:no-repeat;background-position:right bottom;background-size:0% 40%;transition:background-size .8s ease;padding:0 2px;}
  .efx-el[data-fx="highlightSweep"].efx-in{background-size:100% 40%;}
  @keyframes efxAudioPulse{0%,100%{box-shadow:0 0 0 0 #f2a63a55}50%{box-shadow:0 0 0 8px #f2a63a00}}
  .audio-pulse-active{animation:efxAudioPulse 1.4s ease-in-out infinite;border-radius:8px;}
  .efx-badge{
    position:absolute;bottom:6px;left:10px;background:#1b1305cc;color:#f2a63a;font-size:10px;padding:3px 8px;border-radius:20px;
    opacity:0;transition:.15s;z-index:5;pointer-events:none;
  }
  .block:hover .efx-badge, .cell:hover .efx-badge{opacity:1;}

  /* ---------- Modals ---------- */
  .modal-overlay{position:fixed;inset:0;background:#0b0d12aa;display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{width:560px;max-width:92vw;max-height:86vh;overflow:auto;background:var(--chrome-bg-alt);border:1px solid var(--chrome-border);border-radius:14px;padding:0;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--chrome-border);}
  .modal-header h3{margin:0;font-size:15px;color:var(--text-light);}
  .modal-tabs{display:flex;gap:6px;padding:14px 20px 0;}
  .modal-tabs button{flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--chrome-border);background:var(--chrome-bg);color:var(--text-muted);font-size:13px;font-weight:600;}
  .modal-tabs button.active{background:var(--accent);color:#1b1305;border-color:var(--accent);}
  .layout-modal-box{width:660px;}
  .variant-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 20px 22px;}
  .variant-card{border:1px solid var(--chrome-border);background:var(--chrome-bg);border-radius:10px;padding:14px 10px;display:flex;flex-direction:column;gap:9px;align-items:center;}
  .variant-card:hover{border-color:var(--accent);}
  .variant-preview{width:100%;height:52px;display:flex;gap:4px;}
  .variant-preview.gridp{display:grid;gap:4px;}
  .variant-preview>span{
    background:#3a4152;border-radius:4px;color:#c7cbd6;font-size:10px;font-weight:600;
    display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;direction:ltr;
  }
  .variant-card:hover .variant-preview>span{background:var(--accent-dim);color:#1b1305;}
  .variant-label{font-size:12px;color:var(--text-light);text-align:center;font-weight:600;}
  .variant-sub{font-size:10px;color:var(--text-muted);text-align:center;margin-top:-5px;}
  .publish-modal-body{padding:22px 24px 26px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;}
  .publish-modal-body .ok-icon{width:52px;height:52px;border-radius:50%;background:#2fae6a22;color:#3fbf7c;display:flex;align-items:center;justify-content:center;font-size:26px;}
  .publish-actions{display:flex;gap:10px;margin-top:6px;}

  /* ---------- Side panel ---------- */
  .side-panel{width:0;flex:none;background:var(--chrome-bg-alt);border-right:1px solid var(--chrome-border);overflow:hidden;transition:width .18s ease;order:-1;display:flex;flex-direction:column;height:100%;min-height:0;}
  .side-panel.open{width:340px;}
  .panel-header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--chrome-border);}
  .panel-header h3{margin:0;font-size:14px;color:var(--text-light);}
  .panel-body{padding:16px;display:flex;flex-direction:column;gap:14px;width:340px;overflow-y:auto;flex:1 1 auto;min-height:0;}
  .widget-choice{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--chrome-border);border-radius:10px;background:var(--chrome-bg);color:var(--text-light);font-size:13.5px;font-weight:600;}
  .widget-choice:hover{border-color:var(--accent);color:var(--accent);}
  .widget-choice .ico{width:20px;height:20px;flex:none;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;color:var(--text-muted);}
  .field .hint{font-size:10.5px;color:#6d7484;}
  .field input[type=text], .field input[type=url], .field input[type=number], .field select, .field textarea{
    background:var(--chrome-bg);border:1px solid var(--chrome-border);color:var(--text-light);border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;
  }
  .field textarea{resize:vertical;}
  .field input[type=file]{font-size:12px;color:var(--text-muted);}
  .btn-group{display:flex;border:1px solid var(--chrome-border);border-radius:7px;overflow:hidden;}
  .btn-group button{flex:1;background:var(--chrome-bg);border:none;color:var(--text-muted);padding:7px 0;font-size:12px;border-left:1px solid var(--chrome-border);}
  .btn-group button:last-child{border-left:none;}
  .btn-group button.active{background:var(--accent);color:#1b1305;font-weight:700;}
  .btn-group button:hover{color:var(--text-light);}
  .field input[type=range]{width:100%;}
  .range-row{display:flex;align-items:center;gap:8px;}
  .range-row span{font-size:12px;color:var(--text-muted);min-width:36px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-light);}
  .panel-warning{font-size:11.5px;background:#3a2c12;color:#f2c27b;border:1px solid #5a4520;border-radius:8px;padding:8px 10px;line-height:1.6;}
  .panel-divider{height:1px;background:var(--chrome-border);margin:2px 0;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .panel-group{border:1px solid var(--chrome-border);border-radius:9px;margin-bottom:10px;overflow:hidden;}
  .panel-group summary{padding:10px 12px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--text-light);list-style:none;display:flex;align-items:center;justify-content:space-between;background:var(--chrome-bg-alt2);}
  .panel-group summary::-webkit-details-marker{display:none;}
  .panel-group summary::after{content:"›";font-size:16px;color:var(--text-muted);transform:rotate(90deg);transition:.15s;}
  .panel-group[open] summary::after{transform:rotate(-90deg);}
  .panel-group-body{padding:12px;}
  .layout-section-title{font-size:11.5px;font-weight:700;color:var(--accent);margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--chrome-border);}
  .layout-section-title:first-child{margin-top:0;padding-top:0;border-top:none;}
  .danger-btn{background:transparent;border:1px solid #5a3230;color:#e2867a;border-radius:8px;padding:9px 0;font-size:13px;font-weight:600;}
  .danger-btn:hover{background:#e2604f22;}
  .fx-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .replay-inline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .replay-inline button{background:var(--chrome-bg);border:1px solid var(--chrome-border);color:var(--text-light);border-radius:7px;padding:6px 10px;font-size:12px;}
  .replay-inline button:hover{border-color:var(--accent);color:var(--accent);}
  .char-counter{font-size:10.5px;color:#6d7484;text-align:left;direction:ltr;}
  .json-status{font-size:11.5px;padding:6px 9px;border-radius:7px;}
  .json-status.ok{background:#123a26;color:#3fbf7c;}
  .json-status.bad{background:#3a1616;color:#e2867a;}

  /* ================= HEADER / FOOTER (site chrome) ================= */
  .hdr, .ftr{width:100%;box-sizing:border-box;position:relative;}
  .hdr *, .ftr *{box-sizing:border-box;}
  .hdr-topbar{font-size:11.5px;padding:6px 28px;display:none;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .hdr-topbar.on{display:flex;}
  .hdr-topbar .tb-left{display:flex;gap:14px;flex-wrap:wrap;}
  .hdr-inner{max-width:1180px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:16px;position:relative;}
  .hdr-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16.5px;white-space:nowrap;overflow-wrap:anywhere;max-width:220px;}
  .hdr-logo img{max-height:36px;width:auto;object-fit:contain;display:block;}
  .hdr-nav{display:flex;align-items:center;gap:20px;list-style:none;margin:0;padding:0;}
  .hdr-nav a{text-decoration:none;font-size:13.5px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle;}
  .hdr-cta{padding:8px 18px;border-radius:8px;font-weight:600;font-size:12.5px;text-decoration:none;white-space:nowrap;flex:none;}
  .hdr-search{display:none;align-items:center;background:#ffffff18;border:1px solid #ffffff30;border-radius:20px;padding:5px 12px;font-size:12px;gap:6px;max-width:220px;}
  .hdr-search.on{display:flex;}
  .hdr-search input{background:transparent;border:none;outline:none;color:inherit;font-size:12px;width:100%;font-family:inherit;}
  .hdr-burger{display:none;width:34px;height:34px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;align-items:center;justify-content:center;flex:none;opacity:.85;}
  .hdr-spacer{flex:1;}
  .hdr-mobile-panel{display:none;position:absolute;top:100%;right:0;left:0;flex-direction:column;padding:10px 20px 16px;gap:2px;z-index:40;box-shadow:0 14px 30px -14px #00000055;}
  .hdr-mobile-panel.open{display:flex;}
  .hdr-mobile-panel a{padding:10px 4px;text-decoration:none;font-size:13.5px;border-bottom:1px solid currentColor;opacity:.9;}
  .hdr-mobile-panel a:last-child{border-bottom:none;}

  /* mobile collapse: builder simulation + real breakpoint */
  .device-mobile .hdr-nav, .device-tablet .hdr-nav{display:none;}
  .device-mobile .hdr-burger, .device-tablet .hdr-burger{display:flex;}
  .device-mobile .hdr-search, .device-tablet .hdr-search{display:none !important;}
  @media (max-width:900px){
    .hdr-nav{display:none;}
    .hdr-burger{display:flex;}
    .hdr-search{display:none !important;}
  }
  .hdr-h5 .hdr-nav{display:none !important;}
  .hdr-h5 .hdr-burger{display:flex !important;}

  .ftr-f9 .ftr-top{align-items:center;}
  .ftr-f9 .ftr-bottom{border-top-color:#e0e2e7;}

  @media (max-width:700px){
    .ftr-top{flex-direction:column;}
    .ftr-columns{justify-content:flex-start;}
    .ftr-bottom{flex-direction:column;align-items:flex-start;}
  }
  .device-mobile .ftr-top, .device-tablet .ftr-top{flex-direction:column;}
  .device-mobile .ftr-bottom, .device-tablet .ftr-bottom{flex-direction:column;align-items:flex-start;}

  /* canvas hover shortcuts for header/footer chrome */
  .chrome-wrap{position:relative;}
  .chrome-shortcut{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);opacity:0;transition:.15s;z-index:45;
    background:#1b1305;color:var(--accent);font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;border:none;
  }
  .chrome-wrap:hover .chrome-shortcut{opacity:1;}
  .ftr-wrap .chrome-shortcut{top:auto;bottom:8px;}

  /* ---- Appearance section (header/footer manager) ---- */
  .hf-manager{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .hf-manager-card{background:var(--cms-card-bg);border:1px solid var(--cms-border);border-radius:14px;padding:18px 20px;}
  .hf-manager-card h4{margin:0 0 4px;font-size:14.5px;color:var(--cms-text);}
  .hf-manager-card .cur{font-size:12px;color:var(--cms-text-muted);margin-bottom:14px;}
  .hf-preview-frame{border:1px solid var(--cms-border);border-radius:10px;overflow:hidden;margin-bottom:14px;max-height:220px;overflow-y:auto;background:#fff;}
  .hf-manager-card .btn{width:100%;}

  .color-manager{margin-top:20px;background:var(--cms-card-bg);border:1px solid var(--cms-border);border-radius:14px;padding:18px 20px;}
  .color-manager h4{margin:0 0 4px;font-size:14.5px;color:var(--cms-text);}
  .color-manager .cur{font-size:12px;color:var(--cms-text-muted);margin-bottom:14px;}
  .swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px;}
  .swatch-card{border:2px solid var(--cms-border);background:var(--cms-input-bg);border-radius:11px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .swatch-card:hover{border-color:var(--cms-text-faint);}
  .swatch-card.active{box-shadow:0 0 0 2px var(--cms-card-bg), 0 0 0 4px currentColor;}
  .swatch-dot{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px #00000014;}
  .swatch-name{font-size:11.5px;color:var(--cms-text);text-align:center;}
  .custom-color-row{display:flex;align-items:center;gap:12px;border-top:1px solid var(--cms-border-soft);padding-top:14px;}
  .custom-color-row input[type=color]{width:44px;height:36px;border:1px solid var(--cms-border);border-radius:8px;padding:2px;background:var(--cms-input-bg);}
  .custom-color-row .lbl{font-size:12.5px;color:var(--cms-text-muted);flex:1;}

  /* ---- Header/Footer editor modal ---- */
  .hf-modal .modal{width:960px;max-width:95vw;}
  .hf-modal-body{display:flex;gap:0;height:72vh;}
  .hf-modal-left{width:260px;flex:none;border-left:1px solid var(--chrome-border);overflow-y:auto;padding:14px;}
  .hf-modal-right{flex:1;overflow-y:auto;padding:14px 18px;}
  .hf-scope-row{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--chrome-border);font-size:12.5px;color:var(--text-muted);}
  .hf-scope-row select{background:var(--chrome-bg);border:1px solid var(--chrome-border);color:var(--text-light);border-radius:7px;padding:6px 10px;font-size:12.5px;}
  .hf-preview-bar{padding:10px 18px;border-bottom:1px solid var(--chrome-border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .hf-preview-devices{display:flex;gap:4px;background:var(--chrome-bg);border:1px solid var(--chrome-border);border-radius:8px;padding:3px;}
  .hf-preview-devices button{border:none;background:transparent;color:var(--text-muted);padding:5px 9px;border-radius:6px;font-size:11.5px;}
  .hf-preview-devices button.active{background:var(--accent);color:#1b1305;font-weight:700;}
  .hf-preview-box{background:#fff;border-radius:8px;overflow:auto;max-height:34vh;border:1px solid var(--chrome-border);}
  .tpl-gallery{display:grid;grid-template-columns:1fr;gap:8px;}
  .tpl-card{border:1px solid var(--chrome-border);background:var(--chrome-bg);border-radius:9px;padding:10px 12px;text-align:right;color:var(--text-light);font-size:12.5px;display:flex;align-items:center;gap:10px;}
  .tpl-card:hover{border-color:var(--accent);}
  .tpl-card.active{border-color:var(--accent);background:#f2a63a18;color:var(--accent);font-weight:700;}
  .tpl-card .tpl-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5;flex:none;}
  .hf-form-group{border:1px solid var(--chrome-border);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
  .hf-form-group summary{font-size:13px;font-weight:600;color:var(--text-light);cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;}
  .hf-form-group summary::-webkit-details-marker{display:none;}
  .hf-form-group[open] summary{margin-bottom:10px;}
  .hf-repeat-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
  .hf-repeat-row input{flex:1;}
  .hf-repeat-row button{flex:none;width:28px;height:28px;border-radius:6px;border:1px solid var(--chrome-border);background:var(--chrome-bg);color:var(--danger);}
  .hf-add-row{font-size:12px;background:var(--chrome-bg);border:1px dashed var(--chrome-border);color:var(--text-muted);border-radius:7px;padding:6px 10px;width:100%;}
  .hf-add-row:hover{border-color:var(--accent);color:var(--accent);}
  .hf-add-row:disabled{opacity:.4;cursor:not-allowed;}
  .hf-cap{font-size:10.5px;color:#6d7484;}
</style>
</head>

<script>
(function(){
  "use strict";

  /* ================= state ================= */
  let uidc = 0;
  const uid = () => "id" + (++uidc);
  const escapeHtml = s => (s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

  const SCHEMA_TEMPLATES = {
    WebPage: t => ({ "@context":"https://schema.org", "@type":"WebPage", "name":t, "description":"" }),
    Article: t => ({ "@context":"https://schema.org", "@type":"Article", "headline":t, "author":{"@type":"Person","name":""}, "datePublished":"" }),
    Product: t => ({ "@context":"https://schema.org", "@type":"Product", "name":t, "description":"", "offers":{"@type":"Offer","price":"","priceCurrency":"IRR"} }),
    LocalBusiness: t => ({ "@context":"https://schema.org", "@type":"LocalBusiness", "name":t, "address":{"@type":"PostalAddress","streetAddress":"","addressLocality":""}, "telephone":"" }),
    FAQPage: t => ({ "@context":"https://schema.org", "@type":"FAQPage", "mainEntity":[{"@type":"Question","name":"سوال نمونه","acceptedAnswer":{"@type":"Answer","text":"پاسخ نمونه"}}] }),
    Organization: t => ({ "@context":"https://schema.org", "@type":"Organization", "name":t, "url":"", "logo":"" })
  };

  function makePage(title){
    const now = Date.now();
    return {
      id: uid(), title: title || "صفحه جدید", slug: "page-" + Math.floor(Math.random()*9000+1000),
      status: "draft", seoTitle: "", metaDescription: "", metaKeywords: "", ogImage: "", robots: "index",
      schemaType: "WebPage", schemaJson: JSON.stringify(SCHEMA_TEMPLATES.WebPage(title||"صفحه جدید"), null, 2),
      createdAt: now, updatedAt: now,
      headerOverride: null, footerOverride: null,
      blocks: []
    };
  }
  function touchPage(id){ const p = getPage(id); if(p) p.updatedAt = Date.now(); }

  const FA_DIGITS = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
  function toFa(n){ return String(n).replace(/[0-9]/g, d => FA_DIGITS[d]); }
  function formatRelative(ts){
    const diff = Math.max(0, Date.now() - ts);
    const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
    if(diff < 60000) return "چند لحظه پیش";
    if(m < 60) return toFa(m) + " دقیقه پیش";
    if(h < 24) return toFa(h) + " ساعت پیش";
    if(d < 30) return toFa(d) + " روز پیش";
    const dt = new Date(ts);
    return toFa(dt.getFullYear()) + "/" + toFa(dt.getMonth()+1) + "/" + toFa(dt.getDate());
  }

  /* ================= HEADER / FOOTER (site chrome) ================= */
  const HEADER_TEMPLATES = [
    {id:"h1", name:"کلاسیک ساده"},
    {id:"h2", name:"وسط‌چین متمرکز"},
    {id:"h3", name:"نوار اطلاعات بالا"},
    {id:"h4", name:"شفاف روی تصویر"},
    {id:"h5", name:"مینیمال با منوی کشویی"},
    {id:"h6", name:"دکمه پررنگ (CTA محور)"},
    {id:"h7", name:"جستجو + منوی دوردیفه"},
    {id:"h8", name:"چسبان با سایه"},
    {id:"h9", name:"تیره و یکپارچه"}
  ];
  const FOOTER_TEMPLATES = [
    {id:"f1", name:"مینیمال تک‌خط"},
    {id:"f2", name:"چندستونه کلاسیک"},
    {id:"f3", name:"خبرنامه‌محور"},
    {id:"f4", name:"تماس‌محور"},
    {id:"f5", name:"تیره و پررنگ"},
    {id:"f6", name:"کارتی شناور"},
    {id:"f7", name:"مگا فوتر چندستونه"},
    {id:"f8", name:"شبکه‌های اجتماعی محور"},
    {id:"f9", name:"دوستونه ساده"}
  ];
  const SOCIAL_PLATFORMS = [
    {v:"instagram", t:"اینستاگرام", i:"◎"}, {v:"telegram", t:"تلگرام", i:"➤"}, {v:"whatsapp", t:"واتس‌اپ", i:"☎"},
    {v:"twitter", t:"ایکس/توییتر", i:"✕"}, {v:"linkedin", t:"لینکدین", i:"in"}, {v:"youtube", t:"یوتیوب", i:"▶"},
    {v:"email", t:"ایمیل", i:"✉"}
  ];

  const PRESET_PALETTES = [
    {id:"amber", name:"کهربایی (پیش‌فرض)", accent:"#f2a63a", contrast:"#1b1305"},
    {id:"ocean", name:"اقیانوسی", accent:"#2f8fd1", contrast:"#ffffff"},
    {id:"emerald", name:"زمردی", accent:"#1fae74", contrast:"#052e1e"},
    {id:"ruby", name:"یاقوتی", accent:"#e0435a", contrast:"#ffffff"},
    {id:"violet", name:"بنفش", accent:"#7c5cf2", contrast:"#ffffff"},
    {id:"slate", name:"خاکستری خنثی", accent:"#4b5563", contrast:"#ffffff"},
    {id:"rosegold", name:"رزگلد", accent:"#d8a48f", contrast:"#2b1710"},
    {id:"mono", name:"مشکی مینیمال", accent:"#111318", contrast:"#ffffff"}
  ];

  function makeHeaderContent(){
    return {
      logoType:"text", logoText:"برند من", logoImage:"",
